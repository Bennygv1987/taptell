<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Funnel</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
html,body{margin:0;min-height:100%}html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}.tt-embed #funnel{min-height:0!important}#funnel{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}#funnel>.fp{flex:1}.tt-msg{font:15px/1.5 system-ui,sans-serif;color:#6b7280;text-align:center;padding:90px 24px}
.fp{--ease-out:cubic-bezier(.23,1,.32,1);--ease-in-out:cubic-bezier(.77,0,.175,1);container-type:inline-size;--p:#4353ff;--pt:#fff;--bg:#fff;--sf:#f4f5f7;--tx:#111318;--mt:#6b7280;--r:14px;--br:12px;--ff:Inter,system-ui,sans-serif;--hf:var(--ff);font-family:var(--ff);color:var(--tx);background-color:var(--bg);background-size:cover;background-position:center;position:relative;min-height:100%;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;line-height:1.4}
.fp *{box-sizing:border-box}
.fp-ov{position:absolute;inset:0;pointer-events:none;z-index:0}
.fp-top,.fp-body{position:relative;z-index:1}
.fp-top{padding:16px var(--pad,20px) 6px}
.fp-head{display:flex;align-items:center;justify-content:center;position:relative;min-height:30px}
.fp-back{position:absolute;left:-6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--tx);display:grid;place-items:center;cursor:pointer}
.fp-back:hover{background:color-mix(in srgb,var(--tx) 7%,transparent)}
.fp-back svg{width:20px;height:20px}
.fp-logo{font-family:var(--hf);font-weight:700;font-size:16px;letter-spacing:-.01em}
.fp-logo img{max-height:28px;max-width:150px;display:block}
.fp-prog{height:5px;background:color-mix(in srgb,var(--tx) 9%,transparent);border-radius:9px;overflow:hidden;margin-top:12px}
.fp-prog i{display:block;height:100%;background:var(--p);border-radius:9px;transition:width 400ms var(--ease-in-out)}
.fp-steps{display:flex;gap:5px;margin-top:12px}
.fp-steps i{flex:1;height:5px;border-radius:9px;background:color-mix(in srgb,var(--tx) 9%,transparent);transition:background .3s}
.fp-steps i.on{background:var(--p)}
.fp-body{flex:1;padding:14px var(--pad,20px) 32px;display:flex;flex-direction:column}
.fp-page{display:flex;flex-direction:row;flex-wrap:wrap;column-gap:12px;align-content:flex-start;flex:1}
.fp-page>.fp-b,.fp-page>.fp-empty-drop,.fp-page>.fp-sticky{width:100%}
.fp-page>.fp-b.half{width:calc(50% - 6px)}
.fp-page.v-center{align-content:center}
.fp-anim-slide{animation:fpSlide 320ms var(--ease-out)}
.fp-anim-slide.back{animation-name:fpSlideB}
.fp-anim-fade{animation:fpFade 260ms ease}
.fp-anim-up{animation:fpUp 340ms var(--ease-out)}
.fp-anim-zoom{animation:fpZoom 300ms var(--ease-out)}
@keyframes fpSlide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes fpSlideB{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes fpFade{from{opacity:0}to{opacity:1}}
@keyframes fpUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fpZoom{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.fp-b{position:relative}
.fp-h1,.fp-h2,.fp-h3{font-family:var(--hf);font-weight:var(--hw,700);letter-spacing:var(--hls,-.02em);text-transform:var(--htt,none);margin:0;line-height:1.15}
.fp-h1{font-size:calc(28px*var(--sc,1))}.fp-h2{font-size:calc(23px*var(--sc,1))}.fp-h3{font-size:calc(18px*var(--sc,1))}
.fp-txt{font-size:calc(15.5px*var(--sc,1));line-height:var(--lh,1.55);font-weight:var(--tw,400);color:var(--mt);margin:0}
.fp-txt strong,.fp-h1 strong,.fp-h2 strong{color:var(--tx)}
.fp-hl{color:var(--p)}
.fp-img{width:100%;display:block;object-fit:cover}
.fp-ph{background:var(--sf);display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;color:var(--mt);font-size:13px}
.fp-ph svg{width:26px;height:26px;opacity:.6}
.fp-vid{position:relative;aspect-ratio:16/9;width:100%;overflow:hidden;background:#000}
.fp-vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.fp-vid .play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#1f2433,#0b0d12)}
.fp-vid .play span{width:62px;height:62px;border-radius:50%;background:var(--p);display:grid;place-items:center;box-shadow:0 10px 30px -6px var(--p)}
.fp-vid .play svg{width:24px;height:24px;fill:var(--pt);margin-left:3px}
.fp-vid .cap{position:absolute;left:12px;bottom:10px;color:#fff;font-size:12px;opacity:.8}
.fp-btn{appearance:none;border:0;width:100%;padding:var(--bpy,16px) 22px;border-radius:var(--br);background:var(--p);color:var(--pt);font:var(--bw,600) calc(16px*var(--sc,1))/1.2 var(--ff);text-transform:var(--btt,none);letter-spacing:var(--bls,normal);cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:transform 160ms var(--ease-out),filter 150ms ease,box-shadow 200ms ease;text-decoration:none}
@media (hover:hover) and (pointer:fine){.fp-btn:hover{filter:brightness(1.06)}}
.fp-btn:active{transform:scale(.97)}
.fp-btn svg{width:18px;height:18px}
.fp-btn.outline{background:transparent;color:var(--p);box-shadow:inset 0 0 0 2px var(--p)}
.fp-btn.soft{background:color-mix(in srgb,var(--p) 13%,transparent);color:var(--p)}
.fp-btn.ghost{background:transparent;color:var(--mt);font-weight:500;padding:10px}
.fp-btn.auto{width:auto;padding-inline:30px}
.fp-btn.shadow{box-shadow:0 10px 26px -10px color-mix(in srgb,var(--p) 75%,transparent)}
.fp-btn.pulse{animation:fpPulse 2.2s infinite}
@keyframes fpPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--p) 45%,transparent)}60%{box-shadow:0 0 0 12px transparent}}
.fp-sub{display:block;text-align:center;font-size:12.5px;color:var(--mt);margin-top:8px}
.fp-q{font-family:var(--hf);font-weight:650;font-size:calc(17px*var(--sc,1));margin:0 0 4px;letter-spacing:-.01em}
.fp-qd{font-size:14px;color:var(--mt);margin:0 0 12px}
.fp-q+.fp-opts,.fp-q+.fp-field{margin-top:10px}
.fp-opts{display:grid;gap:10px}
.fp-opts.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.fp-opts.grid3{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}
.fp-opt{position:relative;display:flex;align-items:center;gap:12px;padding:14px 15px;border-radius:var(--r);background:var(--sf);border:2px solid transparent;cursor:pointer;text-align:left;font:500 calc(15.5px*var(--sc,1))/1.3 var(--ff);color:var(--tx);transition:border-color 150ms ease,background-color 150ms ease,transform 160ms var(--ease-out),box-shadow 150ms ease;width:100%}
@media (hover:hover) and (pointer:fine){.fp-opt:hover{border-color:color-mix(in srgb,var(--p) 30%,transparent)}}
.fp-opt:active{transform:scale(.97)}
.fp-opt.sel{border-color:var(--p);background:color-mix(in srgb,var(--p) 8%,var(--sf))}
.fp-opt .ico{font-size:21px;width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:10px;background:var(--bg)}
.fp-opt .lbl{flex:1;min-width:0}
.fp-opt .sub{display:block;font-size:12.5px;color:var(--mt);font-weight:400;margin-top:2px}
.fp-opt .pr{display:block;font-size:12.5px;color:var(--p);font-weight:650;margin-top:3px}
.fp-opt .chk{width:22px;height:22px;border-radius:50%;border:2px solid color-mix(in srgb,var(--tx) 18%,transparent);flex:none;display:grid;place-items:center;transition:background-color 150ms ease,border-color 150ms ease;background:var(--bg)}
.fp-opt .chk.sq{border-radius:7px}
.fp-opt .chk svg{width:13px;height:13px;stroke:var(--pt);opacity:0}
.fp-opt.sel .chk{background:var(--p);border-color:var(--p)}
.fp-opt.sel .chk svg{opacity:1}
.fp-opts.grid .fp-opt,.fp-opts.grid3 .fp-opt{flex-direction:column;text-align:center;padding:18px 10px 14px;gap:8px}
.fp-opts.grid .fp-opt .ico,.fp-opts.grid3 .fp-opt .ico{font-size:30px;width:56px;height:56px;border-radius:16px}
.fp-opts.grid .fp-opt .chk,.fp-opts.grid3 .fp-opt .chk{position:absolute;top:8px;right:8px;width:20px;height:20px}
.fp-opts.image{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.fp-opts.image .fp-opt{padding:0;overflow:hidden;flex-direction:column;align-items:stretch;gap:0}
.fp-opts.image .fp-opt .im{aspect-ratio:var(--ir,4/3);background:var(--bg) center/cover;display:grid;place-items:center;font-size:40px}
.fp-opts.image .fp-opt .lbl{padding:10px 12px 12px;text-align:left}
.fp-opts.image .fp-opt .chk{position:absolute;top:8px;right:8px}
.fp-opts.image.one{grid-template-columns:minmax(0,1fr)}
.fp-opts.image.one .fp-opt .im{aspect-ratio:16/8}
.fp-field{display:block}
.fp-lbl{display:block;font-weight:600;font-size:calc(14px*var(--sc,1));margin:0 0 7px}
.fp-lbl .rq{color:var(--p);margin-left:2px}
.fp-in{width:100%;padding:15px 16px;border-radius:var(--r);border:1.5px solid color-mix(in srgb,var(--tx) 12%,transparent);background:var(--bg);font:calc(16px*var(--sc,1)) var(--ff);color:var(--tx);outline:none;transition:border-color .15s,box-shadow .15s}
.fp-in::placeholder{color:color-mix(in srgb,var(--mt) 75%,transparent)}
.fp-in:focus{border-color:var(--p);box-shadow:0 0 0 4px color-mix(in srgb,var(--p) 14%,transparent)}
textarea.fp-in{min-height:110px;resize:vertical}
.fp-iw{position:relative}
.fp-iw .ii{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mt)}
.fp-iw .ii+.fp-in{padding-left:44px}
.fp-err .fp-in,.fp-err .fp-sig,.fp-err .fp-opt,.fp-err .fp-up,.fp-err .fp-day{border-color:#ef4444!important}
.fp-err .fp-cb .box{border-color:#ef4444}
.fp-errmsg{color:#ef4444;font-size:13px;margin-top:7px;font-weight:500}
.fp-rv{font-family:var(--hf);font-size:calc(34px*var(--sc,1));font-weight:700;text-align:center;letter-spacing:-.02em;margin:4px 0 12px}
.fp-rv small{font-size:16px;color:var(--mt);font-weight:500;margin-left:4px}
.fp-range{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:9px;background:linear-gradient(to right,var(--p) var(--fill,50%),color-mix(in srgb,var(--tx) 10%,transparent) var(--fill,50%));outline:none;margin:-6px 0;padding:12px 0;background-clip:content-box;box-sizing:content-box;touch-action:pan-y}
.fp-range::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--p);box-shadow:0 3px 10px rgba(0,0,0,.18);cursor:grab}
.fp-range::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--p);cursor:grab}
.fp-rl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mt);margin-top:6px}
.fp-stars{display:flex;gap:6px;justify-content:center}
.fp-star{background:none;border:0;padding:2px;cursor:pointer;transition:transform 160ms var(--ease-out)}
@media (hover:hover) and (pointer:fine){.fp-star:hover{transform:scale(1.1)}}
.fp-star:active{transform:scale(.92)}
.fp-star svg{width:40px;height:40px;fill:color-mix(in srgb,var(--tx) 12%,transparent);transition:fill .15s}
.fp-star.on svg{fill:#f5b301}
.fp-rlab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mt);margin-top:8px}
.fp-nps{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.fp-nps button{aspect-ratio:1;min-width:0;border-radius:8px;border:0;background:var(--sf);font:600 13px var(--ff);color:var(--tx);cursor:pointer}
.fp-nps button.on{background:var(--p);color:var(--pt)}
.fp-sig{position:relative;border:1.5px dashed color-mix(in srgb,var(--tx) 22%,transparent);border-radius:var(--r);background:var(--bg);height:170px;touch-action:none;overflow:hidden}
.fp-sig canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.fp-sig .hint{position:absolute;left:0;right:0;bottom:34px;text-align:center;color:var(--mt);font-size:13px;pointer-events:none}
.fp-sig .line{position:absolute;left:24px;right:24px;bottom:28px;border-bottom:1.5px solid color-mix(in srgb,var(--tx) 15%,transparent);pointer-events:none}
.fp-sig .clr{position:absolute;top:8px;right:8px;border:0;background:var(--sf);color:var(--mt);font:500 12px var(--ff);padding:10px 12px;min-height:36px;border-radius:8px;cursor:pointer;z-index:2}
.fp-sig.has .hint{display:none}
.fp-cb{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.45;color:var(--mt);cursor:pointer;text-align:left;background:none;border:0;padding:0;font-family:var(--ff);width:100%}
.fp-cb .box{width:22px;height:22px;border-radius:7px;border:2px solid color-mix(in srgb,var(--tx) 20%,transparent);flex:none;display:grid;place-items:center;margin-top:-1px;transition:background-color 150ms ease,border-color 150ms ease,transform 160ms var(--ease-out);background:var(--bg)}
.fp-cb .box svg{width:13px;height:13px;stroke:var(--pt);opacity:0}
.fp-cb.on .box{background:var(--p);border-color:var(--p)}
.fp-cb.on .box svg{opacity:1}
.fp-cb a{color:var(--tx)}
.fp-hr{border:0;border-top:1px solid color-mix(in srgb,var(--tx) 10%,transparent);margin:0}
.fp-list{list-style:none;padding:0;margin:0;display:grid;gap:11px;text-align:left}
.fp-list li{display:flex;gap:12px;align-items:flex-start;font-size:calc(15px*var(--sc,1));line-height:1.45}
.fp-list .li{width:24px;height:24px;flex:none;border-radius:50%;background:color-mix(in srgb,var(--p) 14%,transparent);color:var(--p);display:grid;place-items:center;font-size:12px;font-weight:700}
.fp-list .li svg{width:13px;height:13px;stroke:var(--p)}
.fp-testi{background:var(--sf);border-radius:var(--r);padding:18px;text-align:left}
.fp-testi .st{color:#f5b301;font-size:15px;letter-spacing:2px;margin-bottom:8px}
.fp-testi p{margin:0 0 14px;font-size:calc(15px*var(--sc,1));line-height:1.5}
.fp-testi .au{display:flex;align-items:center;gap:10px}
.fp-testi .av{width:38px;height:38px;border-radius:50%;background:var(--p) center/cover;color:var(--pt);display:grid;place-items:center;font-weight:700;font-size:14px}
.fp-testi .nm{font-weight:600;font-size:14px}.fp-testi .ro{font-size:12.5px;color:var(--mt)}
.fp-faq{display:grid;gap:8px;text-align:left}
.fp-faq details{background:var(--sf);border-radius:var(--r);padding:0 16px}
.fp-faq summary{list-style:none;cursor:pointer;padding:15px 0;font-weight:600;font-size:15px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.fp-faq summary::-webkit-details-marker{display:none}
.fp-faq summary:after{content:"+";font-size:20px;color:var(--mt);font-weight:400;transition:transform .2s}
.fp-faq details[open] summary:after{transform:rotate(45deg)}
.fp-faq details p{margin:0 0 15px;color:var(--mt);font-size:14.5px;line-height:1.5}
.fp-sum{background:var(--sf);border-radius:var(--r);padding:18px;text-align:left}
.fp-sum h4{margin:0 0 12px;font-family:var(--hf);font-size:16px}
.fp-sum .row{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:7px 0;border-bottom:1px dashed color-mix(in srgb,var(--tx) 10%,transparent)}
.fp-sum .row span:first-child{color:var(--mt)}
.fp-sum .row small{display:block;font-size:12px;color:var(--mt);opacity:.8}
.fp-sum .tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px}
.fp-sum .tot b{font-family:var(--hf);font-size:28px;letter-spacing:-.02em;color:var(--p)}
.fp-sum .nt{font-size:12px;color:var(--mt);margin-top:6px}
.fp-sum.compact{text-align:center;padding:16px}
.fp-sum.compact .lab{font-size:13px;color:var(--mt)}
.fp-sum.compact b{display:block;font-family:var(--hf);font-size:30px;color:var(--p);letter-spacing:-.02em;margin-top:2px}
.fp-trust{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.fp-trust span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:550;padding:7px 11px;border-radius:99px;background:var(--sf);color:var(--tx)}
.fp-days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;scroll-snap-type:x proximity;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}.fp-days>*{scroll-snap-align:start}
.fp-days::-webkit-scrollbar{display:none}
.fp-day{flex:none;width:62px;padding:10px 0;border-radius:12px;background:var(--sf);text-align:center;cursor:pointer;border:2px solid transparent;font-family:var(--ff);color:var(--tx)}
.fp-day small{display:block;font-size:11.5px;color:var(--mt);text-transform:uppercase;letter-spacing:.04em}
.fp-day b{display:block;font-size:19px;margin-top:2px}
.fp-day.sel{border-color:var(--p);background:color-mix(in srgb,var(--p) 9%,var(--sf))}
.fp-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.fp-slot{padding:11px 0;border-radius:10px;border:1.5px solid color-mix(in srgb,var(--tx) 12%,transparent);background:var(--bg);font:600 14px var(--ff);color:var(--tx);cursor:pointer}
.fp-slot.sel{background:var(--p);border-color:var(--p);color:var(--pt)}
.fp-up{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 16px;border:1.5px dashed color-mix(in srgb,var(--tx) 22%,transparent);border-radius:var(--r);cursor:pointer;text-align:center;color:var(--mt);font-size:14px;background:var(--bg)}
.fp-up svg{width:26px;height:26px;color:var(--p)}
.fp-up b{color:var(--tx);font-weight:600}
.fp-up input{display:none}
.fp-up img{max-width:100%;max-height:140px;border-radius:10px}
.fp-cd{display:flex;gap:8px;justify-content:center}
.fp-cd div{background:var(--sf);border-radius:12px;padding:10px 0;width:64px;text-align:center}
.fp-cd b{display:block;font-family:var(--hf);font-size:24px}
.fp-cd small{font-size:11px;color:var(--mt);text-transform:uppercase}
.fp-badge{display:inline-flex;align-items:center;gap:6px;font-size:calc(12.5px*var(--sc,1));font-weight:600;padding:6px 12px;border-radius:99px;background:color-mix(in srgb,var(--p) 12%,transparent);color:var(--p)}
.fp-done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-top:40px}
.fp-done .ok{width:72px;height:72px;border-radius:50%;background:color-mix(in srgb,var(--p) 14%,transparent);display:grid;place-items:center}
.fp-done .ok svg{width:34px;height:34px;stroke:var(--p)}
.fp-foot{position:relative;z-index:1;text-align:center;font-size:11px;color:var(--mt);padding:0 0 14px;opacity:.7}
.fp-html{overflow:hidden}

/* ---- extended design ---- */
.fp-head.left{justify-content:flex-start}.fp-head.left.hb{padding-left:34px}
.fp.in-filled .fp-in{background:var(--sf);border-color:transparent}
.fp.in-filled .fp-in:focus{background:var(--bg);border-color:var(--p)}
.fp.in-line .fp-in{border-width:0 0 2px;border-radius:0;background:transparent;padding-left:2px;padding-right:2px}
.fp.in-line .fp-iw .ii{left:2px}.fp.in-line .fp-iw .ii+.fp-in{padding-left:28px}
.fp.in-line .fp-in:focus{box-shadow:none}
.fp.opt-outline .fp-opt{background:transparent;border-color:color-mix(in srgb,var(--tx) 13%,transparent)}
.fp.opt-outline .fp-opt.sel{border-color:var(--p);background:color-mix(in srgb,var(--p) 6%,transparent)}
.fp.opt-outline .fp-opt .ico{background:var(--sf)}
.fp.opt-shadow .fp-opt{background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px -8px rgba(0,0,0,.18)}
.fp.opt-shadow .fp-opt .ico{background:var(--sf)}

    var v = answers[keyOf(b)];
    if(b.type === 'choice' && v != null){
      [].concat(v).forEach(function(id){
        var o = (b.props.options||[]).filter(function(o){ return o.id === id; })[0];

  return {items:items, total: fixed + unitSum*q, qty:qty, unit:unit, score:score};

/* Preisanzeige nach außen: exakt, Spanne oder „ab“ – intern bleibt der exakte Wert */
FP.roundPrice = function(n, r){ r = +r || 0; return r > 0 ? Math.round(n / r) * r : n; };

FP.readable = function(f, answers){

/* Webhook-Werte im Klartext, pro Feld-Schlüssel (kompatibel zu Onepage-Feldern):
   Bewertung/Zahl → Zahl · Einfachauswahl → Text · Mehrfachauswahl → Liste · Einwilligung → Einwilligungstext
   Schlüssel mit Punkt werden verschachtelt: name.firstName + name.lastName → {name:{firstName, lastName}} */
FP.values = function(f, answers){
  var out = {};
  var put = function(k, val){
    var parts = String(k).split('.'), o = out;
    for(var i = 0; i < parts.length - 1; i++){ if(typeof o[parts[i]] !== 'object' || o[parts[i]] === null) o[parts[i]] = {}; o = o[parts[i]]; }
    o[parts[parts.length-1]] = val;
  };
  (f.pages||[]).forEach(function(pg){ (pg.blocks||[]).forEach(function(b){
    var p = b.props || {}; if(!p.key) return;
    var v = answers[p.key];
    if(v == null || v === '' || (Array.isArray(v) && !v.length)) return;
    var label = function(id){ var o = (p.options||[]).filter(function(o){ return o.id === id; })[0]; return o ? (o.value != null && o.value !== '' ? o.value : o.label) : ''; };
    if(b.type === 'choice') put(p.key, p.multi ? [].concat(v).map(label).filter(Boolean) : label([].concat(v)[0]));
    else if(b.type === 'rating' || b.type === 'slider') put(p.key, +v);
    else if(b.type === 'checkbox') put(p.key, v ? String(p.text||'').replace(/\*\*|==|__|\[\[|\]\]/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1') : '');
    else if(b.type === 'calendar') put(p.key, (v.date||'') + (v.time ? ' ' + v.time : ''));
    else if(b.type === 'upload') put(p.key, v.name || '');
    else if(b.type === 'signature') put(p.key, 'Unterschrieben');
    else if(typeof v !== 'object') put(p.key, b.type === 'input' && p.inputType === 'number' ? +v : String(v));
  }); });
  return out;
};

/* Webhook im Onepage-Format (für Empfänger, die bisher Onepage-Leads auswerten).
   Aufbau wie der Onepage-Webhook „lead.created“:
   {type, data:{id, formId, siteId, status, createdAt, updatedAt, source, fields:[{step,label,value,fieldType}], fieldsMap:{"Step N. Schritt -> slug": value}, leadInfo}}
   Step N = Position der Seite im Funnel (1-basiert), label = Feld-Schlüssel, nur besuchte Seiten in Besuchsreihenfolge.
   Auswahl → [{_id, value[, description]}] · Name (name.firstName/lastName) → {firstName, lastName, middleName} */
FP.onepagePayload = function(f, answers, path, meta){
  meta = meta || {};

  var plain = function(t){ return String(t||'').replace(/\*\*|==|__|\[\[|\]\]/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1'); };
  var opt = function(o){ var r = {_id: o.oid || o.id, value: o.value != null && o.value !== '' ? o.value : o.label}; if(o.odesc !== undefined) r.description = o.odesc; else if(o.sub) r.description = o.sub; return r; };
  var fields = [], map = {};
  var show = function(v){ return Array.isArray(v) ? v.map(function(x){ return x && x.value; }).join(', ') : v && typeof v === 'object' ? [v.firstName, v.middleName, v.lastName].filter(Boolean).join(' ') : (v == null ? '' : String(v)); };
  var add = function(pg, label, value, type){
    var no = pages.indexOf(pg) + 1;
    fields.push({step:pg.name, label:label, value:value, fieldType:type});
    map['Step ' + no + '. ' + pg.name + ' -> ' + label] = value;
  };
  (path || []).forEach(function(pid){
    var pg = pages.filter(function(p){ return p.id === pid; })[0]; if(!pg) return;
    var names = {};
    (pg.blocks||[]).forEach(function(b){
      var p = b.props || {}, k = p.key; if(!k) return;
      var v = answers[k];
      var dot = String(k).indexOf('.');
      if(b.type === 'input' && dot > 0){ /* name.firstName → ein Feld „name“ */
        var base = k.slice(0, dot), sub = k.slice(dot + 1);
        if(!names[base]){ names[base] = {firstName:'', lastName:'', middleName:''}; add(pg, base, names[base], 'form-name'); }
        names[base][sub] = v == null ? '' : String(v);
        return;
      }
      if(b.type === 'choice'){
        var sel = [].concat(v == null ? [] : v);
        add(pg, k, (p.options||[]).filter(function(o){ return sel.indexOf(o.id) >= 0; }).map(opt), 'form-select');
      } else if(b.type === 'rating' || b.type === 'slider'){

      } else if(b.type === 'checkbox'){

      }

  });
  var ua = meta.userAgent || '';
  return {type:'lead.created', data:{
    id: meta.id, formId: s.onepageFormId || f.id, siteId: s.onepageSiteId || '', status:'new', createdAt: now, updatedAt: now,
    source: {device: /Mobi|Android|iPhone/i.test(ua) ? 'Mobile' : /iPad|Tablet/i.test(ua) ? 'Tablet' : 'Desktop', os: /Android/i.test(ua) ? 'Android' : /iPhone|iPad|iOS/i.test(ua) ? 'iOS' : /Mac OS/i.test(ua) ? 'macOS' : /Windows/i.test(ua) ? 'Windows' : '', browser: /Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? (/Mobi/.test(ua) ? 'Mobile Chrome' : 'Chrome') : /Safari\//.test(ua) ? (/Mobi/.test(ua) ? 'Mobile Safari' : 'Safari') : /Firefox\//.test(ua) ? 'Firefox' : '',
      page: {id: f.id, title: s.onepageForm || f.name, slug: meta.slug ? '/' + String(meta.slug).replace(/^\//,'') : ''}},
    fields: fields, fieldsMap: map, leadInfo: fields.map(function(x){ return (s.onepageForm || f.name) + ' -> ' + x.step + ' -> ' + x.label + ': ' + show(x.value); }).join(' ')}};
};

/* Personalisierung: {{schluessel}} oder {{schluessel|Ersatztext}} */
FP.VAR_RE = /\{\{\s*([\w.-]+)\s*(?:\|([^}]*))?\}\}/g;
FP.vars = function(f){
  var out = [], seen = {}, add = function(k, l, t){ if(!k || seen[k]) return; seen[k] = 1; out.push({key:k, label:l, type:t}); };
  (f.pages||[]).forEach(function(pg){ (pg.blocks||[]).forEach(function(b){
    var p = b.props || {}; if(!p.key || ['choice','input','slider','rating','calendar'].indexOf(b.type) < 0) return;
    add(p.key, String(p.label || p.question || pg.name || p.key).replace(/\*\*|==|__|\[\[|\]\]/g,'').replace(/\{\{[^}]*\}\}/g,'…').trim(), b.type);
  }); });
  if(seen.name && !seen.vorname) add('vorname', 'Vorname (aus Name)', 'input');
  add('total', 'Gesamtpreis (wie angezeigt)', 'calc'); add('total_exakt', 'Gesamtpreis (exakt)', 'calc'); add('score', 'Punktzahl', 'calc');
  return out;
};
FP.varValue = function(k, f, answers, map){
  if(k === 'total') return FP.priceText(f, FP.computeTotal(f, answers).total);
  if(k === 'total_exakt') return FP.money(FP.computeTotal(f, answers).total, (f.settings||{}).currency);
  if(k === 'score') return String(FP.computeTotal(f, answers).score);
  if(k === 'vorname' && !map.vorname && map.name) return String(map.name).split(' ')[0];
  return map[k] != null ? String(map[k]) : '';
};
FP.interp = function(text, f, answers){
  if(!text || String(text).indexOf('{{') < 0) return text;
  var map = {}, empty = false;
  FP.readable(f, answers || {}).forEach(function(x){ map[x.key] = x.value; });
  var out = String(text).replace(FP.VAR_RE, function(m, k, fb){
    var v = FP.varValue(k, f, answers || {}, map);
    if(v === '' && fb != null) v = fb.trim();
    if(v === '') empty = true;
    return v;
  });
  /* leere Variablen ohne Ersatztext: Satzzeichen aufräumen („Danke, !“ → „Danke!“) */
  if(empty && /^\s*\{\{/.test(text)) out = out.replace(/^[ ,]+/, '').replace(/^\S/, function(c){ return c.toUpperCase(); });
  if(empty) out = out.replace(/[ \t]+([,.!?:;])/g, '$1').replace(/,([!?.])/g, '$1').replace(/[ \t]{2,}/g, ' ').replace(/^[ ,]+/, '');

};
/* Im Editor: Variablen als sichtbare Marken statt leerem Text */
FP.interpEdit = function(text, f){

    return '\u0001' + (tokens.length - 1) + '\u0002';

  if(p.shd) st += 'box-shadow:'+({sm:'0 1px 3px rgba(0,0,0,.08)',md:'0 8px 24px -8px rgba(0,0,0,.18)',lg:'0 20px 50px -14px rgba(0,0,0,.3)'}[p.shd]||'none')+';';
  var cl = 'fp-b'+(err?' fp-err':'')+(p.half?' half':'')+(p.vis&&p.vis!=='all'?' fp-vis-'+p.vis:'');

  return '<div class="'+cl+'" data-bid="'+b.id+'" data-type="'+b.type+'" style="'+st+'"'+(ctx.edit?' draggable="true"':'')+'>'+h+(err?'<div class="fp-errmsg">'+esc(err)+'</div>':'')+'</div>';
};

FP.hasButton = function(page){ return (page.blocks||[]).some(function(b){ return b.type==='button' || (b.type==='choice' && b.props.autoNext && !b.props.multi) || (b.type==='rating' && b.props.autoNext); }); };

FP.renderShell = function(f, idx, inner, opts){

};

FP.renderPage = function(f, idx, ctx){
  var page = f.pages[idx]; if(!page) return '';
  ctx = ctx || {}; ctx.f = f; ctx.answers = ctx.answers || {};

/* ---------- interactive runtime ---------- */
FP.mount = function(root, f, opts){
  opts = opts || {};
  var st = {i:0, hist:[], answers:{}, errors:{}, dir:'fwd', started:false, done:false, startedAt:Date.now()};
  var pages = f.pages;
  var hasSubmit = FP.allBlocks(f).some(function(b){ return b.type==='button' && b.props.action==='submit'; });
  var emit = function(t, d){ if(opts.onEvent) try{ opts.onEvent(t, d||{}); }catch(e){} };
  var timer = null;
  emit('view'); emit('page', {pageId:pages[0] && pages[0].id, index:0});

  function blockById(id){ var r=null; pages.forEach(function(p){ p.blocks.forEach(function(b){ if(b.id===id) r=b; }); }); return r; }
  function scroller(){ return opts.scrollEl || root.closest && root.closest('[data-fp-scroll]') || document.scrollingElement; }

  /* stay = gleiche Seite neu zeichnen (ohne Einblend-Animation, Scrollposition bleibt) */
  function render(stay){
    var page = pages[st.i];
    page.blocks.forEach(function(b){ if(b.type === 'slider' && st.answers[keyOf(b)] == null) st.answers[keyOf(b)] = +(b.props.def != null ? b.props.def : b.props.min); });
    var sc = stay ? scroller() : null, top = sc ? sc.scrollTop : 0;
    root.innerHTML = FP.renderPage(f, st.i, {answers:st.answers, errors:st.errors, dir:st.dir, live:opts.live, noAnim:!!stay || !!opts.still, scope:!!opts.scope, back: st.hist.length>0 && !st.done && page.allowBack!==false && (f.theme||{}).backButton!==false, startedAt:st.startedAt});
    if(sc) sc.scrollTop = top;
    initSignatures(); initCountdown();
  }
  /* Auswahl direkt im DOM markieren – kein Neuaufbau, kein Flackern */
  function clearErr(b){ var w = root.querySelector('.fp-b[data-bid="'+b.id+'"]'); if(w && w.classList.contains('fp-err')){ w.classList.remove('fp-err'); var m = w.querySelector('.fp-errmsg'); if(m) m.remove(); } }
  function markSelection(b){
    var v = st.answers[keyOf(b)], sel = [].concat(v == null ? [] : v);
    if(b.type === 'choice'){
      root.querySelectorAll('[data-act="opt"][data-bid="'+b.id+'"]').forEach(function(el){ el.classList.toggle('sel', sel.indexOf(el.getAttribute('data-oid')) >= 0); });
    } else if(b.type === 'rating'){
      root.querySelectorAll('[data-act="rate"][data-bid="'+b.id+'"]').forEach(function(el){
        var n = +el.getAttribute('data-v');
        if(el.classList.contains('fp-star')) el.classList.toggle('on', v >= n);
        else { el.classList.toggle('on', v === n); if(b.props.style === 'emoji') el.classList.toggle('dim', v != null && v !== n); }
      });
    } else if(b.type === 'checkbox'){
      var cb = root.querySelector('[data-act="cb"][data-bid="'+b.id+'"]'); if(cb) cb.classList.toggle('on', !!v);
    }
    clearErr(b); refreshSums(); refreshVars();
  }
  /* Texte mit {{variablen}} auf derselben Seite live nachziehen */
  function refreshVars(){
    var page = pages[st.i]; if(!page) return;
    page.blocks.forEach(function(b){
      var p = b.props || {}, uses = ['text','label','question','desc','sub','title','note','quote'].some(function(k){ return typeof p[k] === 'string' && p[k].indexOf('{{') >= 0; });
      if(!uses || ['choice','rating','checkbox','input'].indexOf(b.type) >= 0) return;
      var w = root.querySelector('.fp-b[data-bid="'+b.id+'"]'); if(!w) return;
      var tmp = document.createElement('div'); tmp.innerHTML = FP.renderBlock(b, {f:f, answers:st.answers, errors:st.errors, live:opts.live, noAnim:true});
      var n = tmp.firstElementChild; if(n && n.innerHTML !== w.innerHTML) w.innerHTML = n.innerHTML;
    });
  }

  function validate(){
    var page = pages[st.i], errs = {}, ok = true;
    var M = (f.settings||{}).address === 'sie'
      ? {email:'Bitte geben Sie eine gültige E-Mail-Adresse ein.', tel:'Bitte geben Sie eine gültige Telefonnummer ein.', choice:'Bitte wählen Sie eine Option.', checkbox:'Bitte bestätigen Sie dies, um fortzufahren.', signature:'Bitte unterschreiben Sie hier.', calendar:'Bitte wählen Sie Tag und Uhrzeit.'}
      : {email:'Bitte gib eine gültige E-Mail-Adresse ein.', tel:'Bitte gib eine gültige Telefonnummer ein.', choice:'Bitte wähle eine Option.', checkbox:'Bitte bestätige dies, um fortzufahren.', signature:'Bitte unterschreibe hier.', calendar:'Bitte wähle Tag und Uhrzeit.'};
    page.blocks.forEach(function(b){
      var p = b.props||{}, v = st.answers[keyOf(b)];
      if(b.type === 'input' && v && p.inputType === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){ errs[b.id] = M.email; ok = false; return; }
      if(b.type === 'input' && v && p.inputType === 'tel' && String(v).replace(/\D/g,'').length < 6){ errs[b.id] = M.tel; ok = false; return; }
      if(!p.required) return;
      var empty = v == null || v === '' || v === false || (Array.isArray(v) && !v.length);
      if(b.type === 'calendar' && v && !v.time) empty = true;
      if(b.type === 'slider') empty = false;
      if(empty){ ok = false; errs[b.id] = p.errorText || M[b.type] || 'Dieses Feld ist erforderlich.'; }
    });
    st.errors = errs;
    return ok;
  }

  function resolveTarget(target){
    var page = pages[st.i];
    if(target) return target;
    var routed = null;
    page.blocks.forEach(function(b){
      if(b.type==='choice' && !b.props.multi){
        var v = st.answers[keyOf(b)], o = (b.props.options||[]).filter(function(o){return o.id===v;})[0];
        if(o && o.goto) routed = o.goto;
      }
    });
    if(!routed) page.blocks.forEach(function(b){
      if(b.type === 'rating' && (b.props.routes||[]).length){
        var rv = st.answers[keyOf(b)]; if(rv == null) return;
        (b.props.routes||[]).forEach(function(r){ if(!routed && r.goto && rv >= +r.min && rv <= +r.max) routed = r.goto; });
      }
    });
    if(routed) return routed;
    if(page.scoreRoutes && page.scoreRoutes.length){
      var sc = FP.computeTotal(f, st.answers).score;
      for(var i=0;i<page.scoreRoutes.length;i++){ var r = page.scoreRoutes[i]; if(sc >= +r.min && sc <= +r.max && r.goto) return r.goto; }
    }
    if(page.next) return page.next;
    return null;
  }

  function go(target, skipValidate){
    if(!skipValidate && !validate()){ render(true); var e = root.querySelector('.fp-err'); if(e && e.scrollIntoView) e.scrollIntoView({block:'center',behavior:'smooth'}); return false; }
    st.errors = {};
    if(!st.started){ st.started = true; emit('start'); }
    var tid = resolveTarget(target), ni = tid ? pages.map(function(p){return p.id;}).indexOf(tid) : st.i + 1;
    if(ni < 0 || ni >= pages.length){ if(!st.done && !hasSubmit) submit(); return true; }
    st.hist.push(st.i); st.i = ni; st.dir = 'fwd';
    emit('page', {pageId:pages[ni].id, index:ni});
    if((ni === pages.length-1 || pages[ni].submitOnEnter) && !st.done) submit(true);
    render();
    /* Eingebettet (inline): nur bis zum Funnel-Anfang scrollen, nie die ganze Seite nach oben */
    if(opts.inline){ var rt = root.getBoundingClientRect(); if(rt.top < 0) window.scrollTo({top: window.scrollY + rt.top - (opts.scrollOffset || 16), behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); }
    else { var sc = scroller(); if(sc) sc.scrollTop = 0; }
    return true;
  }
  function back(){ if(!st.hist.length) return; st.i = st.hist.pop(); st.dir = 'back'; st.errors = {}; render(); }

  function submit(silent){
    if(st.done) return;
    st.done = true;
    var r = FP.readable(f, st.answers), tot = FP.computeTotal(f, st.answers);
    var path = st.hist.concat([st.i]).map(function(i){ return pages[i] && pages[i].id; }).filter(Boolean);
    var lead = {answers: JSON.parse(JSON.stringify(st.answers)), values: FP.values(f, st.answers), path: path, fields:r, total:tot.total, items:tot.items, score:tot.score, durationSec: Math.round((Date.now()-st.startedAt)/1000)};
    r.forEach(function(x){
      if(x.inputType === 'email' && !lead.email) lead.email = x.value;
      else if(x.inputType === 'tel' && !lead.phone) lead.phone = x.value;
      else if(/name/i.test(x.key) && x.type==='input' && x.inputType!=='email') lead.name = lead.name ? lead.name + ' ' + x.value : x.value;
    });
    if((f.settings||{}).webhookFormat === 'onepage'){
      var hex = ''; for(var hx = 0; hx < 24; hx++) hex += '0123456789abcdef'[Math.floor(Math.random()*16)];
      lead.onepage = FP.onepagePayload(f, st.answers, path, {id: hex, slug: f.slug, userAgent: (typeof navigator !== 'undefined' && navigator.userAgent) || ''});
    }
    emit('complete', lead);
    if(opts.onSubmit) opts.onSubmit(lead);
    if(!silent && st.i === pages.length-1){ root.innerHTML = FP.renderShell(f, st.i, '<div class="fp-done"><div class="ok">'+IC.ok+'</div><h2 class="fp-h2">Vielen Dank!</h2><p class="fp-txt">Deine Angaben sind bei uns eingegangen.</p></div>', {}); }
  }

  function setAns(b, val){ st.answers[keyOf(b)] = val; if(st.errors[b.id]){ delete st.errors[b.id]; } }

  function refreshSums(){
    root.querySelectorAll('[data-sum]').forEach(function(el){
      var b = blockById(el.getAttribute('data-sum')); if(!b) return;
      var tmp = document.createElement('div'); tmp.innerHTML = FP.renderBlock(b, {f:f, answers:st.answers});
      var n = tmp.querySelector('[data-sum]'); if(n) el.replaceWith(n);
    });
  }

  root.addEventListener('click', function(e){
    if(e.target.closest('a[href]')) return;
    var el = e.target.closest('[data-act]'); if(!el || !root.contains(el)) return;
    var act = el.getAttribute('data-act'), b = blockById(el.getAttribute('data-bid'));
    if(!b && act !== 'next' && act !== 'back') return; /* Element gehört nicht (mehr) zu diesem Funnel */
    if(act !== 'sigclr') e.preventDefault();
    if(act === 'next') go();
    else if(act === 'back') back();
    else if(act === 'btn'){
      var p = b.props, a = p.action || 'next';
      if(a === 'url'){ if(opts.onUrl) opts.onUrl(p.url); else window.location.href = p.url; }
      else if(a === 'submit'){ if(!validate()){ render(true); var e2 = root.querySelector('.fp-err'); if(e2 && e2.scrollIntoView) e2.scrollIntoView({block:'center',behavior:'smooth'}); return; } submit(); go(p.target || null, true); }
      else if(a === 'page') go(p.target);
      else go();
    }
    else if(act === 'opt'){
      var oid = el.getAttribute('data-oid'), k = keyOf(b);
      if(b.props.multi){
        var arr = [].concat(st.answers[k] || []), ix = arr.indexOf(oid);
        if(ix >= 0) arr.splice(ix,1); else { if(b.props.maxSelect && arr.length >= +b.props.maxSelect) arr.shift(); arr.push(oid); }
        setAns(b, arr); markSelection(b);
      } else {
        setAns(b, oid); markSelection(b);
        if(b.props.autoNext){ clearTimeout(timer); timer = setTimeout(function(){ go(); }, 260); }
      }
    }
    else if(act === 'rate'){ setAns(b, +el.getAttribute('data-v')); markSelection(b); if(b.props.autoNext){ clearTimeout(timer); timer = setTimeout(function(){ go(); }, 300);} }
    else if(act === 'cb'){ setAns(b, !st.answers[keyOf(b)]); markSelection(b); }
    else if(act === 'day'){ var cv = st.answers[keyOf(b)] || {}; setAns(b, {date:el.getAttribute('data-v'), time: cv.time}); render(true); }
    else if(act === 'slot'){ var cv2 = st.answers[keyOf(b)] || {}; if(!cv2.date) return; setAns(b, {date:cv2.date, time:el.getAttribute('data-v')}); render(true); }
    else if(act === 'sigclr'){ e.preventDefault(); delete st.answers[keyOf(b)]; render(true); }
  });

  root.addEventListener('change', function(e){
    var el = e.target; if(!el || el.type !== 'range') return;
    var b = blockById(el.getAttribute('data-bid')); if(!b || b.type !== 'rating' || !b.props.autoNext) return;
    clearTimeout(timer); timer = setTimeout(function(){ go(); }, 450);
  });
  root.addEventListener('input', function(e){
    var el = e.target, k = el.getAttribute && el.getAttribute('data-key'); if(!k) return;
    var b = blockById(el.getAttribute('data-bid')); if(!b) return;
    if(el.type === 'range' && b && b.type === 'rating'){
      var rv0 = +el.value, rmx = FP.rateMax(b.props); setAns(b, rv0);
      el.style.setProperty('--fill', (rmx > 1 ? (rv0 - 1) / (rmx - 1) * 100 : 0) + '%');
      var fc = root.querySelector('[data-face="'+b.id+'"]'); if(fc){ var nf = FP.faceFor(b.props, rv0); if(fc.textContent !== nf){ fc.textContent = nf; fc.classList.remove('pop'); void fc.offsetWidth; fc.classList.add('pop'); } fc.classList.remove('idle'); }
      var rvv = root.querySelector('[data-rv="'+b.id+'"]'); if(rvv) rvv.textContent = rv0;
      var hn = el.parentNode.querySelector('.fp-hint-c'); if(hn) hn.remove();
      var er = el.closest('.fp-b'); if(er && er.classList.contains('fp-err')){ er.classList.remove('fp-err'); var em = er.querySelector('.fp-errmsg'); if(em) em.remove(); }
      return;
    }
    if(el.type === 'range'){
      var v = +el.value; st.answers[k] = v;
      var pct = ((v - b.props.min) / ((b.props.max - b.props.min)||1)) * 100; el.style.setProperty('--fill', pct+'%');
      var rv = root.querySelector('[data-rv="'+b.id+'"]'); if(rv) rv.textContent = v.toLocaleString('de-DE');
      refreshSums();
    } else {
      st.answers[k] = el.value;
      if(st.errors[b.id]){ delete st.errors[b.id]; var w = el.closest('.fp-b'); if(w){ w.classList.remove('fp-err'); var m = w.querySelector('.fp-errmsg'); if(m) m.remove(); } }
      if(b && b.props.isQuantity) refreshSums();
    }
  });

  root.addEventListener('change', function(e){
    var el = e.target; if(!el.getAttribute || !el.getAttribute('data-up')) return;
    var b = blockById(el.getAttribute('data-up')), file = el.files && el.files[0]; if(!file) return;
    if(/^image\//.test(file.type) && file.size < 6e6){
      var rd = new FileReader();
      rd.onload = function(){
        var img = new Image(); img.onload = function(){
          var c = document.createElement('canvas'), sc = Math.min(1, 1000/Math.max(img.width,img.height)); c.width = img.width*sc; c.height = img.height*sc;
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          setAns(b, {name:file.name, size:file.size, type:file.type, data:c.toDataURL('image/jpeg',.78)}); render(true);
        }; img.src = rd.result;
      };
      rd.readAsDataURL(file);
    } else { setAns(b, {name:file.name, size:file.size, type:file.type}); render(true); }
  });

  root.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target.tagName === 'INPUT'){ e.preventDefault(); var page = pages[st.i]; var btn = page.blocks.filter(function(b){return b.type==='button';})[0]; if(btn){ var bel = root.querySelector('[data-act="btn"][data-bid="'+btn.id+'"]'); if(bel) bel.click(); } else go(); }
  });

  function initSignatures(){
    root.querySelectorAll('.fp-sig canvas').forEach(function(cv){
      var b = blockById(cv.getAttribute('data-bid')), k = keyOf(b), wrap = cv.parentNode;
      var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      cv.width = Math.max(1, r.width*dpr); cv.height = Math.max(1, r.height*dpr);
      var ctx = cv.getContext('2d'); ctx.scale(dpr,dpr); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 2.4;
      ctx.strokeStyle = getComputedStyle(wrap).color || '#111';
      if(st.answers[k]){ var im = new Image(); im.onload = function(){ ctx.drawImage(im,0,0,r.width,r.height); }; im.src = st.answers[k]; }
      var drawing = false, last = null;
      var pos = function(ev){ var rr = cv.getBoundingClientRect(); return {x:ev.clientX-rr.left, y:ev.clientY-rr.top}; };
      cv.addEventListener('pointerdown', function(ev){ drawing = true; last = pos(ev); try{cv.setPointerCapture(ev.pointerId);}catch(x){} wrap.classList.add('has'); ctx.beginPath(); ctx.arc(last.x,last.y,1.1,0,7); ctx.fillStyle = ctx.strokeStyle; ctx.fill(); });
      cv.addEventListener('pointermove', function(ev){ if(!drawing) return; var p = pos(ev); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.quadraticCurveTo(last.x,last.y,p.x,p.y); ctx.stroke(); last = p; });
      var end = function(){ if(!drawing) return; drawing = false; st.answers[k] = cv.toDataURL('image/png'); if(st.errors[b.id]){ delete st.errors[b.id]; var w = cv.closest('.fp-b'); w.classList.remove('fp-err'); var m=w.querySelector('.fp-errmsg'); if(m) m.remove(); } };
      cv.addEventListener('pointerup', end); cv.addEventListener('pointerleave', end); cv.addEventListener('pointercancel', end);
    });
  }
  var cdTimer = null;
  function initCountdown(){
    clearInterval(cdTimer);
    var els = root.querySelectorAll('[data-cd]'); if(!els.length) return;
    cdTimer = setInterval(function(){
      if(!root.isConnected){ clearInterval(cdTimer); return; }
      els.forEach(function(el){ var left = Math.max(0, +el.getAttribute('data-cd') - Date.now()); el.querySelector('[data-mm]').textContent = String(Math.floor(left/60000)).padStart(2,'0'); el.querySelector('[data-ss]').textContent = String(Math.floor(left%60000/1000)).padStart(2,'0'); });
    }, 1000);
  }

  render();
  return { state: st, restart: function(){ st.i=0; st.hist=[]; st.answers={}; st.errors={}; st.done=false; st.started=false; st.startedAt=Date.now(); render(); }, goTo: function(i){ st.i=i; st.hist=[]; render(); } };
};

window.FP = FP;
})();

</script>
<script>
(function(){
  var C = window.FS_CONFIG || {}, el = document.getElementById('funnel');
  var qs = new URLSearchParams(location.search);
  /* Link-Formen: taptell.de/funnelname · taptell.de/f/funnelname · f.html?s=funnelname */
  var slug = qs.get('s') || (location.pathname.match(/\/f\/([^\/?#]+)/) || [])[1] || (location.pathname.match(/^\/([a-z0-9][a-z0-9-]*)\/?$/) || [])[1];
  /* Eingebettet als iFrame: Höhe an die Website melden, damit kein innerer Scrollbalken entsteht */
  if(qs.get('embed') === '1' || window.parent !== window){
    document.documentElement.classList.add('tt-embed');
    var post = function(){ try{ window.parent.postMessage({taptell:'height', h:document.documentElement.scrollHeight}, '*'); }catch(e){} };
    if(window.ResizeObserver) new ResizeObserver(post).observe(document.documentElement); window.addEventListener('load', post);
  }
  var msg = function(t){ el.innerHTML = '<div class="tt-msg">' + t + '</div>'; };
  if(!C.supabaseUrl || !window.supabase){ msg('Dieser Funnel ist nicht verfügbar.'); return; }
  var sb = window.supabase.createClient(C.supabaseUrl, C.supabaseAnonKey, {auth:{persistSession:false, autoRefreshToken:false}});
  /* Eigene Domain (z. B. konfigurator.firma.de): Funnel über den Hostnamen finden */
  if(!slug){
    sb.rpc('resolve_domain', {p_host:location.hostname}).then(function(r){ if(r.data){ slug = r.data; start(); } else msg('Dieser Funnel ist nicht verfügbar.'); });
    return start;
  }
  start();
  function start(){
  var Q = {}; qs.forEach(function(v, k){ if(/^(utm_|gclid|fbclid|ref)/.test(k)) Q[k] = v; });
  sb.rpc('get_public_funnel', {p_slug:slug}).then(function(r){
    if(r.error || !r.data){ msg('Dieser Funnel ist nicht verfügbar.'); return; }
    var F = r.data, t = F.theme || {}, S = F.settings || {};
    document.title = F.name; document.body.style.background = t.bg || '#fff';
    var mt = document.querySelector('meta[name=theme-color]'); if(mt) mt.content = t.bg || '#fff';
    FP.usedFonts(F).forEach(function(n){ var u = FP.fontLink(n); if(u && !(F.fonts || []).some(function(x){ return x.name === n; })){ var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = u; document.head.appendChild(l); } });
    if((F.fonts || []).length){ var st = document.createElement('style'); st.textContent = F.fonts.map(function(x){ return "@font-face{font-family:'" + String(x.name).replace(/'/g,'') + "';src:url(" + x.data + ");font-display:swap}"; }).join('\n'); document.head.appendChild(st); }
    if(S.pixel){ !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js'); fbq('init', String(S.pixel).replace(/\D/g,'')); fbq('track','PageView'); }
    FP.mount(el, F, {live:true,
      onEvent:function(type, d){ if(type === 'complete') return; sb.rpc('track_event', {p_slug:slug, p_type:type, p_page:(d && d.pageId) || null}).then(function(){}); },
      onSubmit:function(lead){
        lead.utm = Q; lead.page = location.href; lead.userAgent = navigator.userAgent.slice(0, 160);
        sb.rpc('submit_lead', {p_slug:slug, p_lead:lead}).then(function(){});
        if(lead.onepage) lead.onepage.data.source.page.slug = '/' + slug;
        /* text/plain: einfacher Request ohne CORS-Vorabprüfung, der Inhalt ist trotzdem JSON */
        if(S.webhook){ try{ fetch(S.webhook, {method:'POST', headers:{'Content-Type':'text/plain;charset=UTF-8'}, body:JSON.stringify(lead.onepage || {type:'lead', funnelId:F.id, funnel:F.name, ts:new Date().toISOString(), lead:lead})}).catch(function(){}); }catch(e){} }
        if(window.fbq) fbq('track', 'Lead', {value:lead.total || 0, currency:S.currency || 'EUR'});
        if(S.redirect) setTimeout(function(){ location.href = S.redirect; }, 1500);
      }});
  });
  }
})();
