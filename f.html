<style>
html,body{margin:0;min-height:100%}html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}.tt-embed #funnel{min-height:0!important}#funnel{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}#funnel>.fp{flex:1}.tt-msg{font:15px/1.5 system-ui,sans-serif;color:#6b7280;text-align:center;padding:90px 24px}
.fp{--ease-out:cubic-bezier(.23,1,.32,1);--ease-in-out:cubic-bezier(.77,0,.175,1);container-type:inline-size;--p:#4353ff;--pt:#fff;--bg:#fff;--sf:#f4f5f7;--tx:#111318;--mt:#6b7280;--r:14px;--br:12px;--ff:Inter,system-ui,sans-serif;--hf:var(--ff);font-family:var(--ff);color:var(--tx);background-color:var(--bg);background-size:cover;background-position:center;position:relative;min-height:100%;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;line-height:1.4}

.fp-logo-l:active{transform:scale(.97)}
.fp-logo-l:focus-visible{outline:2px solid var(--p);outline-offset:2px}
@media (hover:hover) and (pointer:fine){.fp-logo-l:hover{opacity:.8}}
.fp-prog{position:relative;height:var(--prh,5px);background:color-mix(in srgb,var(--tx) 9%,transparent);border-radius:var(--prr,9px);overflow:hidden;margin-top:var(--hg,12px)}
.fp-prog i{position:relative;display:block;height:100%;background:var(--p);border-radius:var(--prr,9px);transition:width 600ms var(--ease-out)}

.fp:not(.is-edit) .fp-steps:not(.pa-none) i.cur,.fp-steps.demo:not(.pa-none) i.cur{background:linear-gradient(var(--p),var(--p)) 0 0/100% 100% no-repeat,color-mix(in srgb,var(--tx) 9%,transparent);animation:fpSeg 560ms var(--ease-out) both}

.fp-steps.pf-glow i.on{box-shadow:0 0 10px color-mix(in srgb,var(--p) 55%,transparent)}

.fp-body{flex:1;padding:var(--cg,14px) var(--pad,20px) var(--bpb,32px);display:flex;flex-direction:column}

.fp-anim-stagger>*:nth-child(2){animation-delay:45ms}.fp-anim-stagger>*:nth-child(3){animation-delay:90ms}.fp-anim-stagger>*:nth-child(4){animation-delay:130ms}
.fp-anim-stagger>*:nth-child(5){animation-delay:165ms}.fp-anim-stagger>*:nth-child(6){animation-delay:195ms}.fp-anim-stagger>*:nth-child(n+7){animation-delay:220ms}
@keyframes fpBlur{from{opacity:0;filter:blur(8px);transform:scale(1.015)}to{opacity:1;filter:none;transform:none}}
@keyframes fpSpring{from{opacity:0;transform:translateX(36px)}35%{opacity:1}to{opacity:1;transform:none}}
@keyframes fpSpringB{from{opacity:0;transform:translateX(-36px)}35%{opacity:1}to{opacity:1;transform:none}}

.fp.opt-shadow{--tile:color-mix(in srgb,var(--bg) 85%,#fff);--tile-on:color-mix(in srgb,var(--p) 6%,var(--tile));
  --tsh:0 0 0 1px color-mix(in srgb,var(--tx) 5%,transparent),0 1px 2px color-mix(in srgb,var(--tx) 6%,transparent),0 6px 16px -6px color-mix(in srgb,var(--tx) 14%,transparent);
  --tsh-hv:0 0 0 1px color-mix(in srgb,var(--tx) 6%,transparent),0 2px 4px color-mix(in srgb,var(--tx) 6%,transparent),0 12px 24px -10px color-mix(in srgb,var(--tx) 22%,transparent);

  --tsh:inset 0 0 0 1.5px rgba(255,255,255,.95),0 0 0 1px color-mix(in srgb,var(--tx) 9%,transparent),0 10px 24px -12px color-mix(in srgb,var(--tx) 26%,transparent);
  --tsh-hv:inset 0 0 0 1.5px #fff,0 0 0 1px color-mix(in srgb,var(--tx) 11%,transparent),0 16px 30px -14px color-mix(in srgb,var(--tx) 32%,transparent);
  --tsh-on:inset 0 0 0 1.5px rgba(255,255,255,.75),0 0 0 1px color-mix(in srgb,var(--p) 35%,transparent),0 14px 28px -12px color-mix(in srgb,var(--p) 60%,transparent)}
.fp.opt-glass :is(.fp-opt,.fp-emo button,.fp-sopt,.fp-nps button,.fp-day,.fp-cb .box){-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%)}

.fp.opt-soft{--tile:var(--bg);--tile-on:var(--bg);
  --tsh:-5px -5px 12px rgba(255,255,255,.95),6px 7px 14px color-mix(in srgb,var(--tx) 13%,transparent),inset 0 1px 0 rgba(255,255,255,.8);

  --tsh-on:inset 4px 4px 9px color-mix(in srgb,var(--tx) 14%,transparent),inset -4px -4px 9px rgba(255,255,255,.95),0 0 0 1px rgba(255,255,255,.6)}

.fp-ul{position:relative;white-space:nowrap;display:inline-block;z-index:0}
.fp-ulsv{position:absolute;display:none;overflow:visible;pointer-events:none;color:var(--p);z-index:-1}
.fp-ulsv path{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:max(2px,.08em)}
/* Schwung – wie im Onepage-Original: flacher Bogen unter dem ganzen Ausdruck */
.hl-swoosh .fp-ulsv.u{display:block;left:0;width:100%;bottom:-.04em;height:.26em}
/* Kreis – handgezeichnete Ellipse um das Wort */
.hl-circle .fp-ul{padding:0 .1em}
.hl-circle .fp-ulsv.c{display:block;left:-.28em;width:calc(100% + .56em);top:-.1em;height:calc(100% + .2em)}
.hl-circle .fp-ulsv.c path{stroke-width:max(2px,.065em)}
/* Linie – gerade, kräftige Unterstreichung */
.hl-line .fp-ul{background:linear-gradient(var(--p),var(--p)) 0 92%/100% .1em no-repeat;padding-bottom:.06em}
/* Marker – Fläche mit runden Ecken */
.hl-marker .fp-ul{background:color-mix(in srgb,var(--p) 22%,transparent);border-radius:.3em;padding:0 .22em;margin:0 -.04em}
/* Textmarker – untere Hälfte wie mit dem Stift markiert */
.hl-half .fp-ul{background:linear-gradient(color-mix(in srgb,var(--p) 42%,transparent),color-mix(in srgb,var(--p) 42%,transparent)) 0 86%/100% .48em no-repeat;padding:0 .1em;border-radius:.12em}
/* Fläche – volle Farbe, Text in Kontrastfarbe */
.hl-pill .fp-ul{background:var(--p);color:var(--pt);border-radius:.3em;padding:0 .24em;margin:0 .02em}
/* Rahmen – Kontur mit runden Ecken */
.hl-stroke .fp-ul{box-shadow:inset 0 0 0 max(2px,.06em) var(--p);border-radius:.32em;padding:0 .22em}
/* Farbe – nur in der Akzentfarbe */
.hl-color .fp-ul{color:var(--p)}
/* Beim Öffnen einer Seite zeichnet sich die Hervorhebung einmal ein (nicht im Editor, nicht bei reduzierter Bewegung) */
@keyframes fpHlDraw{from{clip-path:inset(-20% 100% -20% 0)}to{clip-path:inset(-20% 0 -20% 0)}}
@keyframes fpHlGrow{from{background-size:0 var(--hlh,100%)}}

@media (prefers-reduced-motion:no-preference){
  .fp-page:is([class*="fp-anim-"],.chat-in) :is(.hl-swoosh .fp-ulsv.u,.hl-circle .fp-ulsv.c){animation:fpHlDraw 620ms var(--ease-out) 260ms both}
  .fp-page:is([class*="fp-anim-"],.chat-in) .hl-line .fp-ul{--hlh:.1em;animation:fpHlGrow 520ms var(--ease-out) 260ms both}

}

/* ---- Bewegung & Feinschliff (Emil-Kowalski-Regeln) ---- */
/* Haken in Auswahl & Checkbox: kurzer, kräftiger Einblend-Effekt statt hartem Umschalten */
.fp-opt .chk svg,.fp-cb .box svg{transform:scale(.6);transition:opacity 150ms ease,transform 200ms var(--ease-out)}
.fp-opt.sel .chk svg,.fp-cb.on .box svg{transform:none}

/* Antworten erscheinen beim Seitenwechsel leicht versetzt (30–80 ms) – blockiert keine Klicks */
.fp-anim-slide .fp-opts>*,.fp-anim-up .fp-opts>*,.fp-anim-zoom .fp-opts>*,.fp-anim-fade .fp-opts>*,.fp-anim-blur .fp-opts>*,.fp-anim-spring .fp-opts>*,.fp-anim-tilt .fp-opts>*{animation:fpItem 300ms var(--ease-out) both}

.fp-opts>*:nth-child(5){animation-delay:130ms}.fp-opts>*:nth-child(6){animation-delay:150ms}.fp-opts>*:nth-child(n+7){animation-delay:165ms}

}

   kein grauer Tipp-Blitz, sofortige Reaktion ohne Doppeltipp-Verzögerung,

   Eingabefelder auf Touch-Geräten mind. 16 px – sonst zoomt iOS beim Antippen in die Seite. */
.fp{-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

@media (pointer:coarse){.fp input.fp-in,.fp textarea.fp-in,.fp select{font-size:16px!important}.fp .fp-b.half .fp-in{padding-left:10px;padding-right:10px}.fp .fp-b.half .fp-in::placeholder{font-size:14px}}
@container (max-width:439px){.fp-nps{grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}.fp-nps button{aspect-ratio:auto;height:44px}}

  if(+s.basePrice){ fixed += +s.basePrice; items.push({label:s.baseLabel||'Grundpreis', amount:+s.basePrice}); }

        var o = (b.props.options||[]).filter(function(o){ return o.id === id; })[0];
        if(!o) return;

        if(+o.price){ fixed += +o.price; items.push({label:o.label, amount:+o.price}); }
        if(+o.unitPrice){ unitSum += +o.unitPrice; unitItems.push(o); }

/* Webhook-Werte im Klartext, pro Feld-Schlüssel (kompatibel zu Onepage-Feldern):
   Bewertung/Zahl → Zahl · Einfachauswahl → Text · Mehrfachauswahl → Liste · Einwilligung → Einwilligungstext
   Schlüssel mit Punkt werden verschachtelt: name.firstName + name.lastName → {name:{firstName, lastName}} */
FP.values = function(f, answers){
  var out = {};
  var put = function(k, val){
    var parts = String(k).split('.'), o = out;
    for(var i = 0; i < parts.length - 1; i++){ if(typeof o[parts[i]] !== 'object' || o[parts[i]] === null) o[parts[i]] = {}; o = o[parts[i]]; }
    o[parts[parts.length-1]] = val;
  };
  (f.pages||[]).forEach(function(pg){ (pg.blocks||[]).forEach(function(b){
    var p = b.props || {}; if(!p.key) return;
    var v = answers[p.key];
    if(v == null || v === '' || (Array.isArray(v) && !v.length)) return;
    var label = function(id){ var o = (p.options||[]).filter(function(o){ return o.id === id; })[0]; return o ? (o.value != null && o.value !== '' ? o.value : o.label) : ''; };
    if(b.type === 'choice') put(p.key, p.multi ? [].concat(v).map(label).filter(Boolean) : label([].concat(v)[0]));

/* Webhook im Onepage-Format (für Empfänger, die bisher Onepage-Leads auswerten).
   Aufbau wie der Onepage-Webhook „lead.created“:
   {type, data:{id, formId, siteId, status, createdAt, updatedAt, source, fields:[{step,label,value,fieldType}], fieldsMap:{"Step N. Schritt -> slug": value}, leadInfo}}
   Step N = Position der Seite im Funnel (1-basiert), label = Feld-Schlüssel, nur besuchte Seiten in Besuchsreihenfolge.
   Auswahl → [{_id, value[, description]}] · Name (name.firstName/lastName) → {firstName, lastName, middleName} */

  var opt = function(o){ var r = {_id: o.oid || o.id, value: o.value != null && o.value !== '' ? o.value : o.label}; if(o.odesc !== undefined) r.description = o.odesc; else if(o.sub) r.description = o.sub; return r; };
  var fields = [], map = {};
  var show = function(v){ return Array.isArray(v) ? v.map(function(x){ return x && x.value; }).join(', ') : v && typeof v === 'object' ? [v.firstName, v.middleName, v.lastName].filter(Boolean).join(' ') : (v == null ? '' : String(v)); };
  var add = function(pg, label, value, type){
    var no = pg.opStep || pages.indexOf(pg) + 1; /* Onepage-Schrittnummer, falls bekannt (kann Lücken haben) */
    fields.push({step:pg.name, label:label, value:value, fieldType:type});
    map['Step ' + no + '. ' + pg.name + ' -> ' + label] = value;
  };
  (path || []).forEach(function(pid){
    var pg = pages.filter(function(p){ return p.id === pid; })[0]; if(!pg) return;
    var names = {};
    (pg.blocks||[]).forEach(function(b){
      var p = b.props || {}, k = p.key; if(!k) return;
      var v = answers[k];
      var dot = String(k).indexOf('.');
      if(b.type === 'input' && dot > 0){ /* name.firstName → ein Feld „name“ */
        var base = k.slice(0, dot), sub = k.slice(dot + 1);
        if(!names[base]){ names[base] = {firstName:'', lastName:'', middleName:''}; add(pg, base, names[base], 'form-name'); }
        names[base][sub] = v == null ? '' : String(v);
        return;
      }
      if(b.type === 'choice'){
        var sel = [].concat(v == null ? [] : v);
        add(pg, k, (p.options||[]).filter(function(o){ return sel.indexOf(o.id) >= 0; }).map(opt), 'form-select');
      } else if(b.type === 'rating' || b.type === 'slider'){

      } else if(b.type === 'checkbox'){

      } else if(b.type === 'input'){

      } else if(b.type === 'calendar'){
        add(pg, k, v ? (v.date||'') + (v.time ? ' ' + v.time : '') : '', 'form-date');
      }
    });
  });
  var ua = meta.userAgent || '';
  return {type:'lead.created', data:{
    id: meta.id, formId: s.onepageFormId || f.id, siteId: s.onepageSiteId || '', status:'new', createdAt: now, updatedAt: now,
    source: {device: /Mobi|Android|iPhone/i.test(ua) ? 'Mobile' : /iPad|Tablet/i.test(ua) ? 'Tablet' : 'Desktop', os: /Android/i.test(ua) ? 'Android' : /iPhone|iPad|iOS/i.test(ua) ? 'iOS' : /Mac OS/i.test(ua) ? 'macOS' : /Windows/i.test(ua) ? 'Windows' : '', browser: /Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? (/Mobi/.test(ua) ? 'Mobile Chrome' : 'Chrome') : /Safari\//.test(ua) ? (/Mobi/.test(ua) ? 'Mobile Safari' : 'Safari') : /Firefox\//.test(ua) ? 'Firefox' : '',
      page: {id: f.id, title: s.onepageForm || f.name, slug: meta.slug ? '/' + String(meta.slug).replace(/^\//,'') : ''}},
    fields: fields, fieldsMap: map, leadInfo: fields.map(function(x){ return (s.onepageForm || f.name) + ' -> ' + x.step + ' -> ' + x.label + ': ' + show(x.value); }).join(' ')}};
};

FP.VAR_RE = /\{\{\s*([\w.-]+)\s*(?:\|([^}]*))?\}\}/g;
FP.vars = function(f){
  var out = [], seen = {}, add = function(k, l, t){ if(!k || seen[k]) return; seen[k] = 1; out.push({key:k, label:l, type:t}); };
  (f.pages||[]).forEach(function(pg){ (pg.blocks||[]).forEach(function(b){
    var p = b.props || {}; if(!p.key || ['choice','input','slider','rating','calendar'].indexOf(b.type) < 0) return;
    add(p.key, String(p.label || p.question || pg.name || p.key).replace(/\*\*|==|__|\[\[|\]\]/g,'').replace(/\{\{[^}]*\}\}/g,'…').trim(), b.type);
  }); });
  if(seen.name && !seen.vorname) add('vorname', 'Vorname (aus Name)', 'input');
  add('total', 'Gesamtpreis (wie angezeigt)', 'calc'); add('total_exakt', 'Gesamtpreis (exakt)', 'calc'); add('score', 'Punktzahl', 'calc');
  return out;

FP.varValue = function(k, f, answers, map){
  if(k === 'total') return FP.priceText(f, FP.computeTotal(f, answers).total);
  if(k === 'total_exakt') return FP.money(FP.computeTotal(f, answers).total, (f.settings||{}).currency);
  if(k === 'score') return String(FP.computeTotal(f, answers).score);

FP.interp = function(text, f, answers){

  var map = {}, empty = false;
  FP.readable(f, answers || {}).forEach(function(x){ map[x.key] = x.value; });
  var out = String(text).replace(FP.VAR_RE, function(m, k, fb){
    var v = FP.varValue(k, f, answers || {}, map);
    if(v === '' && fb != null) v = fb.trim();
    if(v === '') empty = true;
    return v;
  });
  /* leere Variablen ohne Ersatztext: Satzzeichen aufräumen („Danke, !“ → „Danke!“) */
  if(empty && /^\s*\{\{/.test(text)) out = out.replace(/^[ ,]+/, '').replace(/^\S/, function(c){ return c.toUpperCase(); });
  if(empty) out = out.replace(/[ \t]+([,.!?:;])/g, '$1').replace(/,([!?.])/g, '$1').replace(/[ \t]{2,}/g, ' ').replace(/^[ ,]+/, '');

};

FP.interpEdit = function(text, f){

  root.addEventListener('click', function(e){ var o = root.querySelector('[data-fab].open'); if(o && !o.contains(e.target)){ o.classList.remove('open'); var ob = o.querySelector('[data-act="fab"]'); if(ob) ob.setAttribute('aria-expanded', 'false'); } }, true);

    } else {

  root.addEventListener('change', function(e){
    var el = e.target; if(!el.getAttribute || !el.getAttribute('data-up')) return;

          var c = document.createElement('canvas'), sc = Math.min(1, 1000/Math.max(img.width,img.height)); c.width = img.width*sc; c.height = img.height*sc;

    } else { setAns(b, {name:file.name, size:file.size, type:file.type}); render(true); }
  });

  root.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target.tagName === 'INPUT'){ e.preventDefault(); var page = pages[st.i]; var btn = page.blocks.filter(function(b){return b.type==='button';})[0]; if(btn){ var bel = root.querySelector('[data-act="btn"][data-bid="'+btn.id+'"]'); if(bel) bel.click(); } else go(); }
  });

  /* Vorher/Nachher-Regler: waagerecht ziehen bewegt den Regler, senkrecht scrollt die Seite weiter (touch-action: pan-y) */
  function cmpSet(c, pct, anim){ pct = Math.max(0, Math.min(100, pct)); c.classList.toggle('anim', !!anim); c.style.setProperty('--x', pct + '%'); c.setAttribute('aria-valuenow', Math.round(pct)); }
  root.addEventListener('pointerdown', function(e){

    var r = c.getBoundingClientRect(), sx = e.clientX, sy = e.clientY, drag = false, moved = false;

    var mv = function(ev){
      if(!drag){ var dx = Math.abs(ev.clientX - sx), dy = Math.abs(ev.clientY - sy); if(dx < 4 && dy < 4) return; moved = true; if(dx <= dy) return end(); drag = true; c.classList.add('drag'); try{ c.setPointerCapture(e.pointerId); }catch(x){} }

  function initSignatures(){

      var b = blockById(cv.getAttribute('data-bid')), k = keyOf(b), wrap = cv.parentNode;
      var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;

  }
  var cdTimer = null;

  render();

  return { state: st, restart: function(){ st.i=0; st.hist=[]; st.answers={}; st.errors={}; st.done=false; st.started=false; st.startedAt=Date.now(); render(); }, goTo: function(i){ st.i=i; st.hist=[]; render(); } };
};

window.FP = FP;
})();

<script>
(function(){
  var C = window.FS_CONFIG || {}, el = document.getElementById('funnel');
  var qs = new URLSearchParams(location.search);
  /* Link-Formen: taptell.de/funnelname · taptell.de/f/funnelname · f.html?s=funnelname */
  var slug = qs.get('s') || (location.pathname.match(/\/f\/([^\/?#]+)/) || [])[1] || (location.pathname.match(/^\/([a-z0-9][a-z0-9-]*)\/?$/) || [])[1];
  /* Eingebettet als iFrame: Höhe an die Website melden, damit kein innerer Scrollbalken entsteht */
  if(qs.get('embed') === '1' || window.parent !== window){
    document.documentElement.classList.add('tt-embed');
    var post = function(){ try{ window.parent.postMessage({taptell:'height', h:document.documentElement.scrollHeight}, '*'); }catch(e){} };
    if(window.ResizeObserver) new ResizeObserver(post).observe(document.documentElement); window.addEventListener('load', post);
  }
  var msg = function(t){ el.innerHTML = '<div class="tt-msg">' + t + '</div>'; };
  if(!C.supabaseUrl || !window.supabase){ msg('Dieser Funnel ist nicht verfügbar.'); return; }
  var sb = window.supabase.createClient(C.supabaseUrl, C.supabaseAnonKey, {auth:{persistSession:false, autoRefreshToken:false}});
  /* Eigene Domain (z. B. konfigurator.firma.de): Funnel über den Hostnamen finden */
  if(!slug){
    sb.rpc('resolve_domain', {p_host:location.hostname}).then(function(r){ if(r.data){ slug = r.data; start(); } else msg('Dieser Funnel ist nicht verfügbar.'); });
    return start;
  }
  start();
  function start(){
  var Q = {}; qs.forEach(function(v, k){ if(/^(utm_|gclid|fbclid|ref)/.test(k)) Q[k] = v; });
  sb.rpc('get_public_funnel', {p_slug:slug}).then(function(r){
    if(r.error || !r.data){ msg('Dieser Funnel ist nicht verfügbar.'); return; }
    var F = r.data, t = F.theme || {}, S = F.settings || {};
    document.title = F.name; document.body.style.background = t.bg || '#fff';
    var mt = document.querySelector('meta[name=theme-color]'); if(mt) mt.content = t.bg || '#fff';
    FP.usedFonts(F).forEach(function(n){ var u = FP.fontLink(n); if(u && !(F.fonts || []).some(function(x){ return x.name === n; })){ var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = u; document.head.appendChild(l); } });
    if((F.fonts || []).length){ var st = document.createElement('style'); st.textContent = F.fonts.map(function(x){ return "@font-face{font-family:'" + String(x.name).replace(/'/g,'') + "';src:url(" + x.data + ");font-display:swap}"; }).join('\n'); document.head.appendChild(st); }
    /* Meta-Pixel erst nach Einwilligung in Marketing (wenn das Cookie-Banner aktiv ist) */
    var initPixel = function(){ if(!S.pixel || window.fbq) return; !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js'); fbq('init', String(S.pixel).replace(/\D/g,'')); fbq('track','PageView'); };
    if(!FP.consentOn(F)) initPixel();
    FP.mount(el, F, {live:true, history:true,
      onConsent:function(v){ if(v && v.mkt) initPixel(); },
      onEvent:function(type, d){ if(type === 'complete') return; sb.rpc('track_event', {p_slug:slug, p_type:type, p_page:(d && d.pageId) || null}).then(function(){}); },
      onSubmit:function(lead){
        lead.utm = Q; lead.page = location.href; lead.userAgent = navigator.userAgent.slice(0, 160);
        if(FP.consentOn(F)) lead.consent = FP.getConsent(F);
        sb.rpc('submit_lead', {p_slug:slug, p_lead:lead}).then(function(){});
        if(lead.onepage) lead.onepage.data.source.page.slug = '/' + slug;
        /* text/plain: einfacher Request ohne CORS-Vorabprüfung, der Inhalt ist trotzdem JSON */
        if(S.webhook){ try{ fetch(S.webhook, {method:'POST', headers:{'Content-Type':'text/plain;charset=UTF-8'}, body:JSON.stringify(lead.onepage || {type:'lead', funnelId:F.id, funnel:F.name, ts:new Date().toISOString(), lead:lead})}).catch(function(){}); }catch(e){} }
        if(window.fbq) fbq('track', 'Lead', {value:lead.total || 0, currency:S.currency || 'EUR'});
        if(S.redirect) setTimeout(function(){ location.href = S.redirect; }, 1500);
      }});
  });
  }
})();
