<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TapTell – Mobile Funnels</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c2e3d'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='800' font-size='30' fill='white' text-anchor='middle'%3ETT%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style id="player-css">
.fp{container-type:inline-size;--p:#4353ff;--pt:#fff;--bg:#fff;--sf:#f4f5f7;--tx:#111318;--mt:#6b7280;--r:14px;--br:12px;--ff:Inter,system-ui,sans-serif;--hf:var(--ff);font-family:var(--ff);color:var(--tx);background-color:var(--bg);background-size:cover;background-position:center;position:relative;min-height:100%;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;line-height:1.4}
.fp *{box-sizing:border-box}
.fp-ov{position:absolute;inset:0;pointer-events:none;z-index:0}
.fp-top,.fp-body{position:relative;z-index:1}
.fp-top{padding:16px var(--pad,20px) 6px}
.fp-head{display:flex;align-items:center;justify-content:center;position:relative;min-height:30px}
.fp-back{position:absolute;left:-6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--tx);display:grid;place-items:center;cursor:pointer}
.fp-back:hover{background:color-mix(in srgb,var(--tx) 7%,transparent)}
.fp-back svg{width:20px;height:20px}
.fp-logo{font-family:var(--hf);font-weight:700;font-size:16px;letter-spacing:-.01em}
.fp-logo img{max-height:28px;max-width:150px;display:block}
.fp-prog{height:5px;background:color-mix(in srgb,var(--tx) 9%,transparent);border-radius:9px;overflow:hidden;margin-top:12px}
.fp-prog i{display:block;height:100%;background:var(--p);border-radius:9px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.fp-steps{display:flex;gap:5px;margin-top:12px}
.fp-steps i{flex:1;height:5px;border-radius:9px;background:color-mix(in srgb,var(--tx) 9%,transparent);transition:background .3s}
.fp-steps i.on{background:var(--p)}
.fp-body{flex:1;padding:14px var(--pad,20px) 32px;display:flex;flex-direction:column}
.fp-page{display:flex;flex-direction:row;flex-wrap:wrap;column-gap:12px;align-content:flex-start;flex:1}
.fp-page>.fp-b,.fp-page>.fp-empty-drop,.fp-page>.fp-sticky{width:100%}
.fp-page>.fp-b.half{width:calc(50% - 6px)}
.fp-page.v-center{align-content:center}
.fp-anim-slide{animation:fpSlide .4s cubic-bezier(.2,.8,.2,1)}
.fp-anim-slide.back{animation-name:fpSlideB}
.fp-anim-fade{animation:fpFade .4s ease}
.fp-anim-up{animation:fpUp .45s cubic-bezier(.2,.8,.2,1)}
.fp-anim-zoom{animation:fpZoom .4s cubic-bezier(.2,.8,.2,1)}
@keyframes fpSlide{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes fpSlideB{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes fpFade{from{opacity:0}to{opacity:1}}
@keyframes fpUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fpZoom{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.fp-b{position:relative}
.fp-h1,.fp-h2,.fp-h3{font-family:var(--hf);font-weight:var(--hw,700);letter-spacing:var(--hls,-.02em);text-transform:var(--htt,none);margin:0;line-height:1.15}
.fp-h1{font-size:calc(28px*var(--sc,1))}.fp-h2{font-size:calc(23px*var(--sc,1))}.fp-h3{font-size:calc(18px*var(--sc,1))}
.fp-txt{font-size:calc(15.5px*var(--sc,1));line-height:var(--lh,1.55);font-weight:var(--tw,400);color:var(--mt);margin:0}
.fp-txt strong,.fp-h1 strong,.fp-h2 strong{color:var(--tx)}
.fp-hl{color:var(--p)}
.fp-img{width:100%;display:block;object-fit:cover}
.fp-ph{background:var(--sf);display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;color:var(--mt);font-size:13px}
.fp-ph svg{width:26px;height:26px;opacity:.6}
.fp-vid{position:relative;aspect-ratio:16/9;width:100%;overflow:hidden;background:#000}
.fp-vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.fp-vid .play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#1f2433,#0b0d12)}
.fp-vid .play span{width:62px;height:62px;border-radius:50%;background:var(--p);display:grid;place-items:center;box-shadow:0 10px 30px -6px var(--p)}
.fp-vid .play svg{width:24px;height:24px;fill:var(--pt);margin-left:3px}
.fp-vid .cap{position:absolute;left:12px;bottom:10px;color:#fff;font-size:12px;opacity:.8}
.fp-btn{appearance:none;border:0;width:100%;padding:var(--bpy,16px) 22px;border-radius:var(--br);background:var(--p);color:var(--pt);font:var(--bw,600) calc(16px*var(--sc,1))/1.2 var(--ff);text-transform:var(--btt,none);letter-spacing:var(--bls,normal);cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:transform .12s,filter .15s,box-shadow .2s;text-decoration:none}
.fp-btn:hover{filter:brightness(1.06)}
.fp-btn:active{transform:scale(.98)}
.fp-btn svg{width:18px;height:18px}
.fp-btn.outline{background:transparent;color:var(--p);box-shadow:inset 0 0 0 2px var(--p)}
.fp-btn.soft{background:color-mix(in srgb,var(--p) 13%,transparent);color:var(--p)}
.fp-btn.ghost{background:transparent;color:var(--mt);font-weight:500;padding:10px}
.fp-btn.auto{width:auto;padding-inline:30px}
.fp-btn.shadow{box-shadow:0 10px 26px -10px color-mix(in srgb,var(--p) 75%,transparent)}
.fp-btn.pulse{animation:fpPulse 2.2s infinite}
@keyframes fpPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--p) 45%,transparent)}60%{box-shadow:0 0 0 12px transparent}}
.fp-sub{display:block;text-align:center;font-size:12.5px;color:var(--mt);margin-top:8px}
.fp-q{font-family:var(--hf);font-weight:650;font-size:calc(17px*var(--sc,1));margin:0 0 4px;letter-spacing:-.01em}
.fp-qd{font-size:14px;color:var(--mt);margin:0 0 12px}
.fp-q+.fp-opts,.fp-q+.fp-field{margin-top:10px}
.fp-opts{display:grid;gap:10px}
.fp-opts.grid{grid-template-columns:1fr 1fr}
.fp-opts.grid3{grid-template-columns:1fr 1fr 1fr}
.fp-opt{position:relative;display:flex;align-items:center;gap:12px;padding:14px 15px;border-radius:var(--r);background:var(--sf);border:2px solid transparent;cursor:pointer;text-align:left;font:500 calc(15.5px*var(--sc,1))/1.3 var(--ff);color:var(--tx);transition:border-color .15s,background .15s,transform .12s,box-shadow .15s;width:100%}
.fp-opt:hover{border-color:color-mix(in srgb,var(--p) 30%,transparent)}
.fp-opt:active{transform:scale(.985)}
.fp-opt.sel{border-color:var(--p);background:color-mix(in srgb,var(--p) 8%,var(--sf))}
.fp-opt .ico{font-size:21px;width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:10px;background:var(--bg)}
.fp-opt .lbl{flex:1;min-width:0}
.fp-opt .sub{display:block;font-size:12.5px;color:var(--mt);font-weight:400;margin-top:2px}
.fp-opt .pr{display:block;font-size:12.5px;color:var(--p);font-weight:650;margin-top:3px}
.fp-opt .chk{width:22px;height:22px;border-radius:50%;border:2px solid color-mix(in srgb,var(--tx) 18%,transparent);flex:none;display:grid;place-items:center;transition:all .15s;background:var(--bg)}
.fp-opt .chk.sq{border-radius:7px}
.fp-opt .chk svg{width:13px;height:13px;stroke:var(--pt);opacity:0}
.fp-opt.sel .chk{background:var(--p);border-color:var(--p)}
.fp-opt.sel .chk svg{opacity:1}
.fp-opts.grid .fp-opt,.fp-opts.grid3 .fp-opt{flex-direction:column;text-align:center;padding:18px 10px 14px;gap:8px}
.fp-opts.grid .fp-opt .ico,.fp-opts.grid3 .fp-opt .ico{font-size:30px;width:56px;height:56px;border-radius:16px}
.fp-opts.grid .fp-opt .chk,.fp-opts.grid3 .fp-opt .chk{position:absolute;top:8px;right:8px;width:20px;height:20px}
.fp-opts.image{grid-template-columns:1fr 1fr}
.fp-opts.image .fp-opt{padding:0;overflow:hidden;flex-direction:column;align-items:stretch;gap:0}
.fp-opts.image .fp-opt .im{aspect-ratio:4/3;background:var(--bg) center/cover;display:grid;place-items:center;font-size:40px}
.fp-opts.image .fp-opt .lbl{padding:10px 12px 12px;text-align:left}
.fp-opts.image .fp-opt .chk{position:absolute;top:8px;right:8px}
.fp-opts.image.one{grid-template-columns:1fr}
.fp-opts.image.one .fp-opt .im{aspect-ratio:16/8}
.fp-field{display:block}
.fp-lbl{display:block;font-weight:600;font-size:calc(14px*var(--sc,1));margin:0 0 7px}
.fp-lbl .rq{color:var(--p);margin-left:2px}
.fp-in{width:100%;padding:15px 16px;border-radius:var(--r);border:1.5px solid color-mix(in srgb,var(--tx) 12%,transparent);background:var(--bg);font:calc(16px*var(--sc,1)) var(--ff);color:var(--tx);outline:none;transition:border-color .15s,box-shadow .15s}
.fp-in::placeholder{color:color-mix(in srgb,var(--mt) 75%,transparent)}
.fp-in:focus{border-color:var(--p);box-shadow:0 0 0 4px color-mix(in srgb,var(--p) 14%,transparent)}
textarea.fp-in{min-height:110px;resize:vertical}
.fp-iw{position:relative}
.fp-iw .ii{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mt)}
.fp-iw .ii+.fp-in{padding-left:44px}
.fp-err .fp-in,.fp-err .fp-sig,.fp-err .fp-opt,.fp-err .fp-up,.fp-err .fp-day{border-color:#ef4444!important}
.fp-err .fp-cb .box{border-color:#ef4444}
.fp-errmsg{color:#ef4444;font-size:13px;margin-top:7px;font-weight:500}
.fp-rv{font-family:var(--hf);font-size:calc(34px*var(--sc,1));font-weight:700;text-align:center;letter-spacing:-.02em;margin:4px 0 12px}
.fp-rv small{font-size:16px;color:var(--mt);font-weight:500;margin-left:4px}
.fp-range{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:9px;background:linear-gradient(to right,var(--p) var(--fill,50%),color-mix(in srgb,var(--tx) 10%,transparent) var(--fill,50%));outline:none;margin:6px 0}
.fp-range::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--p);box-shadow:0 3px 10px rgba(0,0,0,.18);cursor:grab}
.fp-range::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--p);cursor:grab}
.fp-rl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mt);margin-top:6px}
.fp-stars{display:flex;gap:6px;justify-content:center}
.fp-star{background:none;border:0;padding:2px;cursor:pointer;transition:transform .12s}
.fp-star:hover{transform:scale(1.12)}
.fp-star svg{width:40px;height:40px;fill:color-mix(in srgb,var(--tx) 12%,transparent);transition:fill .15s}
.fp-star.on svg{fill:#f5b301}
.fp-rlab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mt);margin-top:8px}
.fp-nps{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.fp-nps button{aspect-ratio:1;border-radius:8px;border:0;background:var(--sf);font:600 13px var(--ff);color:var(--tx);cursor:pointer}
.fp-nps button.on{background:var(--p);color:var(--pt)}
.fp-sig{position:relative;border:1.5px dashed color-mix(in srgb,var(--tx) 22%,transparent);border-radius:var(--r);background:var(--bg);height:170px;touch-action:none;overflow:hidden}
.fp-sig canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.fp-sig .hint{position:absolute;left:0;right:0;bottom:34px;text-align:center;color:var(--mt);font-size:13px;pointer-events:none}
.fp-sig .line{position:absolute;left:24px;right:24px;bottom:28px;border-bottom:1.5px solid color-mix(in srgb,var(--tx) 15%,transparent);pointer-events:none}
.fp-sig .clr{position:absolute;top:8px;right:8px;border:0;background:var(--sf);color:var(--mt);font:500 12px var(--ff);padding:6px 10px;border-radius:8px;cursor:pointer;z-index:2}
.fp-sig.has .hint{display:none}
.fp-cb{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.45;color:var(--mt);cursor:pointer;text-align:left;background:none;border:0;padding:0;font-family:var(--ff);width:100%}
.fp-cb .box{width:22px;height:22px;border-radius:7px;border:2px solid color-mix(in srgb,var(--tx) 20%,transparent);flex:none;display:grid;place-items:center;margin-top:-1px;transition:all .15s;background:var(--bg)}
.fp-cb .box svg{width:13px;height:13px;stroke:var(--pt);opacity:0}
.fp-cb.on .box{background:var(--p);border-color:var(--p)}
.fp-cb.on .box svg{opacity:1}
.fp-cb a{color:var(--tx)}
.fp-hr{border:0;border-top:1px solid color-mix(in srgb,var(--tx) 10%,transparent);margin:0}
.fp-list{list-style:none;padding:0;margin:0;display:grid;gap:11px;text-align:left}
.fp-list li{display:flex;gap:12px;align-items:flex-start;font-size:calc(15px*var(--sc,1));line-height:1.45}
.fp-list .li{width:24px;height:24px;flex:none;border-radius:50%;background:color-mix(in srgb,var(--p) 14%,transparent);color:var(--p);display:grid;place-items:center;font-size:12px;font-weight:700}
.fp-list .li svg{width:13px;height:13px;stroke:var(--p)}
.fp-testi{background:var(--sf);border-radius:var(--r);padding:18px;text-align:left}
.fp-testi .st{color:#f5b301;font-size:15px;letter-spacing:2px;margin-bottom:8px}
.fp-testi p{margin:0 0 14px;font-size:calc(15px*var(--sc,1));line-height:1.5}
.fp-testi .au{display:flex;align-items:center;gap:10px}
.fp-testi .av{width:38px;height:38px;border-radius:50%;background:var(--p) center/cover;color:var(--pt);display:grid;place-items:center;font-weight:700;font-size:14px}
.fp-testi .nm{font-weight:600;font-size:14px}.fp-testi .ro{font-size:12.5px;color:var(--mt)}
.fp-faq{display:grid;gap:8px;text-align:left}
.fp-faq details{background:var(--sf);border-radius:var(--r);padding:0 16px}
.fp-faq summary{list-style:none;cursor:pointer;padding:15px 0;font-weight:600;font-size:15px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.fp-faq summary::-webkit-details-marker{display:none}
.fp-faq summary:after{content:"+";font-size:20px;color:var(--mt);font-weight:400;transition:transform .2s}
.fp-faq details[open] summary:after{transform:rotate(45deg)}
.fp-faq details p{margin:0 0 15px;color:var(--mt);font-size:14.5px;line-height:1.5}
.fp-sum{background:var(--sf);border-radius:var(--r);padding:18px;text-align:left}
.fp-sum h4{margin:0 0 12px;font-family:var(--hf);font-size:16px}
.fp-sum .row{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:7px 0;border-bottom:1px dashed color-mix(in srgb,var(--tx) 10%,transparent)}
.fp-sum .row span:first-child{color:var(--mt)}
.fp-sum .row small{display:block;font-size:12px;color:var(--mt);opacity:.8}
.fp-sum .tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px}
.fp-sum .tot b{font-family:var(--hf);font-size:28px;letter-spacing:-.02em;color:var(--p)}
.fp-sum .nt{font-size:12px;color:var(--mt);margin-top:6px}
.fp-sum.compact{text-align:center;padding:16px}
.fp-sum.compact .lab{font-size:13px;color:var(--mt)}
.fp-sum.compact b{display:block;font-family:var(--hf);font-size:30px;color:var(--p);letter-spacing:-.02em;margin-top:2px}
.fp-trust{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.fp-trust span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:550;padding:7px 11px;border-radius:99px;background:var(--sf);color:var(--tx)}
.fp-days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.fp-days::-webkit-scrollbar{display:none}
.fp-day{flex:none;width:62px;padding:10px 0;border-radius:12px;background:var(--sf);text-align:center;cursor:pointer;border:2px solid transparent;font-family:var(--ff);color:var(--tx)}
.fp-day small{display:block;font-size:11.5px;color:var(--mt);text-transform:uppercase;letter-spacing:.04em}
.fp-day b{display:block;font-size:19px;margin-top:2px}
.fp-day.sel{border-color:var(--p);background:color-mix(in srgb,var(--p) 9%,var(--sf))}
.fp-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.fp-slot{padding:11px 0;border-radius:10px;border:1.5px solid color-mix(in srgb,var(--tx) 12%,transparent);background:var(--bg);font:600 14px var(--ff);color:var(--tx);cursor:pointer}
.fp-slot.sel{background:var(--p);border-color:var(--p);color:var(--pt)}
.fp-up{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 16px;border:1.5px dashed color-mix(in srgb,var(--tx) 22%,transparent);border-radius:var(--r);cursor:pointer;text-align:center;color:var(--mt);font-size:14px;background:var(--bg)}
.fp-up svg{width:26px;height:26px;color:var(--p)}
.fp-up b{color:var(--tx);font-weight:600}
.fp-up input{display:none}
.fp-up img{max-width:100%;max-height:140px;border-radius:10px}
.fp-cd{display:flex;gap:8px;justify-content:center}
.fp-cd div{background:var(--sf);border-radius:12px;padding:10px 0;width:64px;text-align:center}
.fp-cd b{display:block;font-family:var(--hf);font-size:24px}
.fp-cd small{font-size:11px;color:var(--mt);text-transform:uppercase}
.fp-badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:99px;background:color-mix(in srgb,var(--p) 12%,transparent);color:var(--p)}
.fp-done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-top:40px}
.fp-done .ok{width:72px;height:72px;border-radius:50%;background:color-mix(in srgb,var(--p) 14%,transparent);display:grid;place-items:center}
.fp-done .ok svg{width:34px;height:34px;stroke:var(--p)}
.fp-foot{position:relative;z-index:1;text-align:center;font-size:11px;color:var(--mt);padding:0 0 14px;opacity:.7}
.fp-html{overflow:hidden}

/* ---- extended design ---- */
.fp-head.left{justify-content:flex-start}.fp-head.left.hb{padding-left:34px}
.fp.in-filled .fp-in{background:var(--sf);border-color:transparent}
.fp.in-filled .fp-in:focus{background:var(--bg);border-color:var(--p)}
.fp.in-line .fp-in{border-width:0 0 2px;border-radius:0;background:transparent;padding-left:2px;padding-right:2px}
.fp.in-line .fp-iw .ii{left:2px}.fp.in-line .fp-iw .ii+.fp-in{padding-left:28px}
.fp.in-line .fp-in:focus{box-shadow:none}
.fp.opt-outline .fp-opt{background:transparent;border-color:color-mix(in srgb,var(--tx) 13%,transparent)}
.fp.opt-outline .fp-opt.sel{border-color:var(--p);background:color-mix(in srgb,var(--p) 6%,transparent)}
.fp.opt-outline .fp-opt .ico{background:var(--sf)}
.fp.opt-shadow .fp-opt{background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px -8px rgba(0,0,0,.18)}
.fp.opt-shadow .fp-opt .ico{background:var(--sf)}
.fp.opt-shadow .fp-opt.sel{box-shadow:0 0 0 1px var(--p),0 8px 22px -10px color-mix(in srgb,var(--p) 60%,transparent)}
.fp-sticky{position:sticky;bottom:0;z-index:4;margin:auto calc(-1*var(--pad,20px)) -32px;padding:16px var(--pad,20px) 18px;background:linear-gradient(to bottom,transparent,var(--sbg,var(--bg)) 26%)}
.fp-sticky .fp-b{margin-bottom:0!important}
.fp-ea-fade{animation:fpFade .55s both}.fp-ea-up{animation:fpUp .6s both}.fp-ea-zoom{animation:fpZoom .55s both}.fp-ea-left{animation:fpSlide .55s both}
@container (min-width:640px){.fp-top,.fp-body{width:100%;max-width:560px;margin-left:auto;margin-right:auto}.fp-vis-mobile{display:none}}
@container (max-width:639px){.fp-vis-desktop{display:none}}

.fp-ul{position:relative;white-space:nowrap;display:inline-block}

.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:var(--sh2);display:flex;gap:8px;align-items:center;animation:pop .2s}
.toast svg{color:#7cf0c2}
/* ===== EDITOR ===== */
.ed{display:grid;grid-template-rows:56px 1fr;height:100%;background:var(--bg)}
.etop{display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line);z-index:5}
.etop .nmin{border:1px solid transparent;background:none;font-weight:600;font-size:14.5px;padding:5px 8px;border-radius:7px;outline:none;min-width:80px;max-width:300px}
.etop .nmin:hover{border-color:var(--line)}
.etop .nmin:focus{border-color:var(--a);box-shadow:0 0 0 3px var(--aS)}
.etop .sv{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:5px}
.etop .sp{flex:1}
.etop .vr{width:1px;height:22px;background:var(--line);margin:0 4px}
.ebody{display:grid;grid-template-columns:272px 1fr 320px;min-height:0}
.lp,.rp{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.rp{border-right:0;border-left:1px solid var(--line)}
.ptabs{display:flex;gap:2px;padding:10px 12px 0;border-bottom:1px solid var(--line)}
.ptabs button{border:0;background:none;padding:8px 10px 10px;font-weight:550;font-size:13px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.ptabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.pscroll{overflow:auto;flex:1;padding:14px}
.libg{margin-bottom:18px}
.libg h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600}
.lib{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.li{display:flex;align-items:center;gap:8px;padding:8px 9px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:grab;font-size:12.5px;font-weight:500;user-select:none;transition:all .12s;text-align:left}
.li:hover{border-color:#c5d0da;background:#fafbfc;box-shadow:0 2px 6px -2px rgba(28,46,61,.16)}
.li:active{cursor:grabbing}
.li .lic{width:26px;height:26px;border-radius:7px;background:#f2f3f6;display:grid;place-items:center;flex:none;color:var(--ink2)}
.li .lic svg{width:15px;height:15px}
.li.wide{grid-column:span 2}
.li.wide .lic{background:var(--aS);color:var(--a)}
.libsearch{margin-bottom:14px}
.plist{display:flex;flex-direction:column;gap:4px}
.pitem{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;cursor:pointer;border:1px solid transparent;font-size:13px;font-weight:500;user-select:none}
.pitem:hover{background:#f5f6f8}
.pitem.on{background:var(--aS);border-color:#d3dce5;color:var(--a)}
.pitem .n{width:22px;height:22px;border-radius:6px;background:#eef0f3;display:grid;place-items:center;font-size:11px;font-weight:650;color:var(--ink2);flex:none}
.pitem.on .n{background:var(--a);color:#fff}
.pitem .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .c{font-size:11px;color:var(--mut)}
.pitem.dragover{border-color:#2563eb;border-style:dashed;background:#f3f7ff}
.pitem .go{font-size:10.5px;color:var(--mut);display:flex;align-items:center;gap:3px}
.canvas{overflow:auto;position:relative;display:flex;flex-direction:column;align-items:center;padding:18px 20px 40px;background:radial-gradient(circle at 1px 1px,#dcdee5 1px,transparent 0) 0 0/18px 18px,var(--bg)}
.pstrip{display:flex;gap:6px;align-items:center;margin-bottom:16px;flex-wrap:wrap;justify-content:center;max-width:100%}
.pchip{display:flex;align-items:center;gap:6px;height:30px;padding:0 11px 0 6px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:550;cursor:pointer;box-shadow:var(--sh);white-space:nowrap;max-width:170px}
.pchip span.t{overflow:hidden;text-overflow:ellipsis}
.pchip .n{width:19px;height:19px;border-radius:50%;background:#eef0f3;display:grid;place-items:center;font-size:10.5px;flex:none}
.pchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pchip.on .n{background:rgba(255,255,255,.18)}
.pchip.dragover{outline:2px dashed var(--a);outline-offset:2px}
.pchip.add{padding:0 10px;color:var(--mut)}
.phone{width:390px;height:800px;border-radius:48px;background:#0d0d0f;padding:11px;box-shadow:0 40px 80px -30px rgba(15,17,23,.45),0 0 0 1px #2a2a2e,inset 0 0 0 2px #3a3a3f;position:relative;flex:none;transition:width .25s}
.phone .scr{width:100%;height:100%;border-radius:38px;overflow:auto;position:relative;background:#fff;scrollbar-width:none}
.phone .scr::-webkit-scrollbar{display:none}
.phone .notch{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:96px;height:28px;border-radius:20px;background:#0d0d0f;z-index:20;pointer-events:none}
.phone .sbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 34px;font-size:13.5px;font-weight:600;position:sticky;top:0;z-index:10;pointer-events:none}
.phone .sbar i{display:inline-block;width:24px;height:11px;border:1.5px solid currentColor;border-radius:3px;position:relative;opacity:.9}
.phone .sbar i:after{content:"";position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1px}
.phone .scr>.fp-host{min-height:calc(100% - 44px);display:flex;flex-direction:column}
.phone .scr>.fp-host>.fp{flex:1}
.phone.desk{width:min(900px,100%);height:640px;border-radius:14px;padding:0;background:#fff;box-shadow:var(--sh2),0 0 0 1px var(--line)}
.phone.desk .scr{border-radius:14px}
.phone.desk .notch,.phone.desk .sbar{display:none}
.phone.desk .scr>.fp-host{min-height:100%}
/* edit overlays */
.fp.is-edit .fp-b{cursor:pointer;border-radius:8px;outline:1.5px solid transparent;outline-offset:5px;transition:outline-color .12s}
.fp.is-edit .fp-b *{pointer-events:none}
.fp.is-edit .fp-b:hover{outline-color:rgba(37,99,235,.45)}
.fp.is-edit .fp-b.sel{outline:2px solid #2563eb}
.fp.is-edit .fp-b.dragging{opacity:.35}
.fp.is-edit .fp-auto{opacity:.55;cursor:default}
.fp.is-edit .fp-auto:after{content:"Automatischer Weiter-Button";position:absolute;top:-9px;right:6px;font:600 9.5px var(--ui);background:#fff;color:#7a8090;padding:1px 6px;border-radius:4px;border:1px solid var(--line);opacity:0;transition:opacity .15s}
.fp.is-edit .fp-auto:hover:after{opacity:1}
.fp-empty-drop{border:2px dashed rgba(37,99,235,.35);border-radius:14px;padding:46px 20px;text-align:center;color:#2563eb;font:500 13.5px var(--ui);background:rgba(37,99,235,.04);margin-bottom:16px}
.dropline{position:absolute;left:14px;right:14px;height:3px;background:#2563eb;border-radius:3px;z-index:30;pointer-events:none;box-shadow:0 0 0 3px rgba(37,99,235,.18)}
.dropline:before,.dropline:after{content:"";position:absolute;top:-3.5px;width:10px;height:10px;border-radius:50%;background:#2563eb}
.dropline:before{left:-5px}.dropline:after{right:-5px}
.btool{position:absolute;z-index:40;display:flex;gap:2px;background:var(--ink);border-radius:8px;padding:3px;box-shadow:var(--sh2)}
.btool button{width:26px;height:26px;border:0;background:none;color:#fff;border-radius:6px;cursor:pointer;display:grid;place-items:center}
.btool button:hover{background:rgba(255,255,255,.15)}
.btool button svg{width:14px;height:14px}
.btool .tl{color:#c9cbe0;font-size:11px;font-weight:600;padding:0 8px 0 6px;display:flex;align-items:center}
.canvas-hint{font-size:11.5px;color:var(--mut);margin-top:14px;display:flex;gap:14px}
.canvas-hint kbd{font:600 10.5px var(--ui);background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px}
/* props panel */
.psec{border-bottom:1px solid var(--line2);padding:0 0 14px;margin-bottom:14px}
.psec:last-child{border-bottom:0}
.psec>h5{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.bhead{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.bhead .lic{width:32px;height:32px;border-radius:9px;background:var(--aS);color:var(--a);display:grid;place-items:center}
.bhead b{display:block;font-size:14px}
.bhead small{color:var(--mut);font-size:12px}
.oped{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
.oped .oh{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 8px}
.oped .oh .em{width:30px;height:30px;text-align:center;border:1px solid var(--line);border-radius:7px;font-size:15px;padding:0;flex:none;outline:none}
.oped .oh .ol{flex:1;height:30px;border:1px solid transparent;border-radius:7px;padding:0 7px;font-size:13px;outline:none;min-width:0}
.oped .oh .ol:hover{border-color:var(--line)}
.oped .oh .ol:focus,.oped .oh .em:focus{border-color:var(--a)}
.oped .ob{padding:8px 10px 10px;border-top:1px solid var(--line2);display:none;background:#fbfbfc;border-radius:0 0 10px 10px}
.oped.open .ob{display:block}
.oped .ob .fld{margin-bottom:9px}
.oped .ob .inp{height:30px;font-size:12.5px}
.ibtn{width:26px;height:26px;border:0;background:none;border-radius:6px;cursor:pointer;display:grid;place-items:center;color:var(--mut);flex:none}
.ibtn:hover{background:#f0f1f4;color:var(--ink)}
.ibtn svg{width:14px;height:14px}
.strl{display:flex;gap:6px;margin-bottom:6px}
.strl .inp{flex:1}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.preset{border:1.5px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;background:#fff;text-align:left;transition:all .12s}
.preset:hover{border-color:#c7c9d6}
.preset.on{border-color:var(--a);box-shadow:0 0 0 3px var(--aS)}
.preset .sw{height:30px;border-radius:6px;display:flex;align-items:flex-end;padding:4px;gap:3px}
.preset .sw i{width:12px;height:12px;border-radius:4px;display:block}
.preset span{display:block;font-size:11.5px;font-weight:600;margin-top:6px}
.fontsel option{font-size:14px}
.emptyp{text-align:center;color:var(--mut);padding:30px 10px;font-size:13px}
.emptyp .ic{width:46px;height:46px;border-radius:12px;background:#f3f4f7;display:grid;place-items:center;margin:0 auto 12px}
.linkrow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-top:4px}
.varlist{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.varlist code{font-size:11px;background:#f1f2f5;padding:2px 6px;border-radius:5px;cursor:pointer;color:var(--ink2)}
.varlist code:hover{background:var(--aS);color:var(--a)}

.pvw{position:fixed;inset:0;z-index:170;background:rgba(12,13,18,.82);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;animation:fade .2s}
.pvw .pbar{display:flex;gap:8px;align-items:center;color:#fff}

.pvw .pbar .btn:hover{background:rgba(255,255,255,.18)}
.pvw .pbar .seg{background:rgba(255,255,255,.1)}

.pvw .pbar .seg button.on{background:#fff;color:var(--ink)}

.pvw .phone.desk{height:min(720px,calc(100vh - 110px))}
.pvw .note{color:#a3a7b6;font-size:12px}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs2 button{border:0;background:none;padding:8px 12px;font-weight:550;font-size:13px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs2 button.on{color:var(--ink);border-bottom-color:var(--ink)}
.callout{display:flex;gap:10px;padding:12px 14px;border-radius:10px;background:#f3f6f9;border:1px solid #dfe6ed;font-size:12.5px;color:#1c2e3d;line-height:1.5;margin-bottom:14px}

.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}

FP.readable = function(f, answers){
  var out = [];

    else if(b.type === 'slider') val = v + (p.unit ? ' ' + p.unit : '');
    else if(b.type === 'rating') val = p.style === 'nps' ? v + ' / 10' : v + ' / ' + (p.max||5) + ' ★';
    else if(b.type === 'calendar') val = fmtDate(v.date) + (v.time ? ' · ' + v.time + ' Uhr' : '');

    else if(b.type === 'upload'){ val = v.name; extra = v.data || null; }
    else if(typeof v === 'object') return;
    out.push({key:k, label:String(label).replace(/\*\*|==/g,''), value:String(val), type:b.type, image:extra, inputType:p.inputType});
  }); });

};

FP.interp = function(text, f, answers){
  if(!text || text.indexOf('{{') < 0) return text;
  var r = FP.readable(f, answers), map = {};
  r.forEach(function(x){ map[x.key] = x.value; });
  return text.replace(/\{\{\s*([\w.-]+)\s*\}\}/g, function(m, k){
    if(k === 'total') return FP.money(FP.computeTotal(f, answers).total, (f.settings||{}).currency);
    if(k === 'score') return String(FP.computeTotal(f, answers).score);
    if(k === 'vorname' && !map.vorname && map.name) return String(map.name).split(' ')[0];
    return map[k] != null ? map[k] : '';
  });
};

FP.hasButton = function(page){ return (page.blocks||[]).some(function(b){ return b.type==='button' || (b.type==='choice' && b.props.autoNext && !b.props.multi); }); };

FP.renderShell = function(f, idx, inner, opts){

/* ---------- interactive runtime ---------- */
FP.mount = function(root, f, opts){

  function validate(){

    page.blocks.forEach(function(b){
      var p = b.props||{}, v = st.answers[keyOf(b)];
      if(b.type === 'input' && v && p.inputType === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){ errs[b.id] = 'Bitte gib eine gültige E-Mail-Adresse ein.'; ok = false; return; }

      if(!p.required) return;

      if(b.type === 'calendar' && v && !v.time) empty = true;
      if(b.type === 'slider') empty = false;

    });

    var page = pages[st.i];
    if(target) return target;

      if(b.type==='choice' && !b.props.multi){
        var v = st.answers[keyOf(b)], o = (b.props.options||[]).filter(function(o){return o.id===v;})[0];

      if(x.inputType === 'email' && !lead.email) lead.email = x.value;
      else if(x.inputType === 'tel' && !lead.phone) lead.phone = x.value;
      else if(/name/i.test(x.key) && x.type==='input' && x.inputType!=='email') lead.name = lead.name ? lead.name + ' ' + x.value : x.value;

  }

  function setAns(b, val){ st.answers[keyOf(b)] = val; if(st.errors[b.id]){ delete st.errors[b.id]; } }

    root.querySelectorAll('[data-sum]').forEach(function(el){
      var b = blockById(el.getAttribute('data-sum')); if(!b) return;
      var tmp = document.createElement('div'); tmp.innerHTML = FP.renderBlock(b, {f:f, answers:st.answers});
      var n = tmp.querySelector('[data-sum]'); if(n) el.replaceWith(n);
    });
  }

  root.addEventListener('click', function(e){
    var el = e.target.closest('[data-act]'); if(!el || !root.contains(el)) return;
    var act = el.getAttribute('data-act'), b = blockById(el.getAttribute('data-bid'));

    else if(act === 'rate'){ setAns(b, +el.getAttribute('data-v')); render(); if(b.props.autoNext){ clearTimeout(timer); timer = setTimeout(function(){ go(); }, 300);} }
    else if(act === 'cb'){ setAns(b, !st.answers[keyOf(b)]); render(); }

    else if(act === 'sigclr'){ e.preventDefault(); delete st.answers[keyOf(b)]; render(); }
  });

  root.addEventListener('input', function(e){
    var el = e.target, k = el.getAttribute && el.getAttribute('data-key'); if(!k) return;
    var b = blockById(el.getAttribute('data-bid'));
    if(el.type === 'range'){
      var v = +el.value; st.answers[k] = v;
      var pct = ((v - b.props.min) / ((b.props.max - b.props.min)||1)) * 100; el.style.setProperty('--fill', pct+'%');
      var rv = root.querySelector('[data-rv="'+b.id+'"]'); if(rv) rv.textContent = v.toLocaleString('de-DE');

    }
  });

  root.addEventListener('change', function(e){

  root.addEventListener('keydown', function(e){

  });

  function initSignatures(){
    root.querySelectorAll('.fp-sig canvas').forEach(function(cv){

      cv.addEventListener('pointerup', end); cv.addEventListener('pointerleave', end); cv.addEventListener('pointercancel', end);
    });

  function initCountdown(){
    clearInterval(cdTimer);
    var els = root.querySelectorAll('[data-cd]'); if(!els.length) return;
    cdTimer = setInterval(function(){

      els.forEach(function(el){ var left = Math.max(0, +el.getAttribute('data-cd') - Date.now()); el.querySelector('[data-mm]').textContent = String(Math.floor(left/60000)).padStart(2,'0'); el.querySelector('[data-ss]').textContent = String(Math.floor(left%60000/1000)).padStart(2,'0'); });
    }, 1000);
  }

  render();
  return { state: st, restart: function(){ st.i=0; st.hist=[]; st.answers={}; st.errors={}; st.done=false; st.started=false; st.startedAt=Date.now(); render(); }, goTo: function(i){ st.i=i; st.hist=[]; render(); } };
};

window.FP = FP;
})();

  var views = 0, leads = db.leads.length, comp = 0; db.funnels.forEach(function(f){ views += f.stats.views; comp += f.stats.completes; });
  var week = db.leads.filter(function(l){ return l.createdAt > Date.now() - 7*864e5; }).length;
  var live = db.funnels.filter(function(f){ return f.status === 'live'; }).length;
  var h = '<div class="page"><div class="ph"><div><h1>Funnels</h1><p>Erstelle, gestalte und verwalte deine mobilen Funnels.</p></div><div class="sp"></div><button class="btn pri" data-a="newFunnel">'+I('plus')+'Neuer Funnel</button></div>';
  h += '<div class="kpis">'
    + kpi('Aktive Funnels', live + ' / ' + db.funnels.length, 'live geschaltet', 'funnel')
    + kpi('Aufrufe', fmtNum(views), 'gesamt', 'eye')
    + kpi('Leads', fmtNum(leads), '<b>+'+week+'</b> in den letzten 7 Tagen', 'inbox')
    + kpi('Ø Conversion', (views ? (comp/views*100) : 0).toFixed(1).replace('.',',') + ' %', 'Aufruf → Abschluss', 'percent') + '</div>';
  h += '<div class="toolbar"><div class="seg">'+[['all','Alle'],['live','Live'],['draft','Entwurf']].map(function(x){ return '<button class="'+(S.filter===x[0]?'on':'')+'" data-a="ffilter" data-v="'+x[0]+'">'+x[1]+'</button>'; }).join('')+'</div><div style="flex:1"></div><select class="inp" id="fcl" style="width:210px;height:36px"><option value="">Alle Kunden</option><option value="-"'+(S.fclient==='-'?' selected':'')+'>Ohne Kunde (intern)</option>'+(db.clients||[]).map(function(c){ return '<option value="'+c.id+'"'+(S.fclient===c.id?' selected':'')+'>'+esc(c.name)+'</option>'; }).join('')+'</select><label class="search">'+I('search')+'<input id="fq" placeholder="Funnels durchsuchen …" value="'+esc(S.q)+'"></label></div>';
  h += '<div class="grid">';
  fs.forEach(function(f){
    var lc = leadsOf(f.id).length;
    h += '<div class="fcard" data-a="edit" data-id="'+f.id+'"><div class="menu"><button class="btn sm ic" data-a="fmenu" data-id="'+f.id+'">'+I('more')+'</button></div><div class="thumb">'+mini(f)+'</div>'
      + '<div class="meta"><div class="nm"><span>'+esc(f.name)+'</span><span class="pill '+(f.status==='live'?'live':'draft')+'" style="flex:none">'+(f.status==='live'?'Live':'Entwurf')+'</span></div>'
      + '<div class="st"><span><b>'+fmtNum(f.stats.views)+'</b>Aufrufe</span><span><b>'+lc+'</b>Leads</span><span><b>'+conv(f).toFixed(1).replace('.',',')+'%</b>CR</span></div>'
      + '<div class="st" style="margin-top:4px">'+f.pages.length+' Seiten · bearbeitet '+fmtRel(f.updatedAt)+'</div>'
      + '<div class="cchip">'+(f.clientId && clientById(f.clientId) ? I('folder',12)+'<span>'+esc(clientById(f.clientId).name)+'</span>'+(f.shared?'<span class="pill live nos" style="margin-left:auto">'+I('eye',11)+' freigeschaltet</span>':'<span class="pill draft nos" style="margin-left:auto">nicht freigeschaltet</span>') : '<span style="color:var(--mut)">Intern · keinem Kunden zugeordnet</span>')+'</div></div></div>';
  });
  h += '<button class="newcard" data-a="newFunnel"><div class="pl">'+I('plus',20)+'</div><b style="color:var(--ink)">Neuer Funnel</b><span style="font-size:12.5px">Aus Vorlage oder leer starten</span></button></div>';
  if(!fs.length && S.q) h += '<div class="empty" style="margin-top:16px">Keine Funnels gefunden.</div>';
  return h + '</div>';
}
function kpi(l, v, d, ic){ return '<div class="kpi"><div class="l">'+I(ic,14)+l+'</div><div class="v">'+v+'</div><div class="d">'+d+'</div></div>'; }

function templateGallery(){

    + shown.map(function(x){ var f = {pages:x.d.pages, theme:x.d.theme, settings:x.d.settings||{}}; return '<div class="tcard" role="button" tabindex="0" data-a="useTpl" data-id="'+x.id+'"><div class="thumb">'+mini(f)+'</div><div class="tm"><b>'+esc(x.d.name)+'</b><span>'+esc(x.d.desc)+'</span><div class="tags">'+x.d.cats.map(function(c){ return '<span class="tag'+(c==='Konfigurator'?' a':'')+'">'+c+'</span>'; }).join('')+'<span class="tag">'+x.d.pages.length+' Seiten</span></div></div></div>'; }).join('')

function newFunnelModal(){

function createFromTpl(id){
  var f = T.newFunnel(id);
  if(db.defaults && db.defaults.webhook && !f.settings.webhook) f.settings.webhook = db.defaults.webhook;
  db.funnels.unshift(f); save(true);
  toast('Funnel „'+f.name+'“ erstellt');
  go('editor', f.id);
}
function funnelMenu(btn, id){
  var f = getF(id);
  dropdown(btn, [
    {k:'e', l:'Bearbeiten', ic:'edit', fn:function(){ go('editor', id); }},
    {k:'p', l:'Vorschau', ic:'eye', fn:function(){ openPreview(f); }},

    {k:'x', l:'Exportieren / Einbetten', ic:'code', fn:function(){ publishModal(f); }},
    {k:'a', l:'Analytics', ic:'chart', fn:function(){ S.afid = id; go('analytics'); }},
    '-',

  ]);
}
function duplicateFunnel(f){
  var c = clone(f); c.id = uid()+uid().slice(0,4); c.name = f.name + ' (Kopie)'; c.status = 'draft'; c.createdAt = c.updatedAt = Date.now(); c.stats = {views:0,starts:0,completes:0,pages:{},daily:{}}; delete c.demo;
  var map = {};
  c.pages.forEach(function(p){ var n = uid(); map[p.id] = n; p.id = n; p.blocks.forEach(function(b){ b.id = uid(); }); });
  c.pages.forEach(function(p){ if(p.next) p.next = map[p.next] || ''; (p.scoreRoutes||[]).forEach(function(r){ r.goto = map[r.goto] || ''; }); p.blocks.forEach(function(b){ if(b.props.target) b.props.target = map[b.props.target] || ''; (b.props.options||[]).forEach(function(o){ if(o.goto) o.goto = map[o.goto] || ''; }); }); });
  db.funnels.unshift(c); save(); render(); toast('Funnel dupliziert');
}

/* ---------- views: contacts ---------- */

  var q = S.cf.q.toLowerCase();
  return visibleLeads().filter(function(l){ return (S.cf.funnel === 'all' || l.funnelId === S.cf.funnel) && (S.cf.status === 'all' || l.status === S.cf.status) && (!q || [l.name,l.email,l.phone,l.funnelName].join(' ').toLowerCase().indexOf(q) >= 0); });
}

  var ls = filteredLeads(), nSel = Object.keys(S.csel).filter(function(k){ return S.csel[k]; }).length;

    + '<select class="inp" style="width:200px;height:36px" id="cfun"><option value="all">Alle Funnels</option>'+visibleFunnels().map(function(f){ return '<option value="'+f.id+'"'+(S.cf.funnel===f.id?' selected':'')+'>'+esc(f.name)+'</option>'; }).join('')+'</select>'
    + '<label class="search" style="min-width:220px">'+I('search')+'<input id="cq" placeholder="Name, E-Mail, Telefon …" value="'+esc(S.cf.q)+'"></label></div>';
  if(nSel) h += '<div class="callout" style="align-items:center;margin-bottom:12px"><b>'+nSel+' ausgewählt</b><span style="flex:1"></span>Status setzen: '+STATUSES.map(function(s){ return '<button class="btn sm" data-a="bulk" data-v="'+s[0]+'">'+s[1]+'</button>'; }).join(' ')+''+(isAdmin()?'<button class="btn sm danger" data-a="bulkdel">'+I('trash',13)+'Löschen</button>':'')+'</div>';
  h += '<div class="card" style="overflow:auto">';
  if(!ls.length) h += '<div class="emptyp" style="padding:60px"><div class="ic">'+I('inbox',20)+'</div>Noch keine Kontakte'+(db.leads.length?' für diesen Filter':'')+'.<br><span style="font-size:12px">Teste einen Funnel in der Vorschau – die Einträge landen hier.</span></div>';
  else {
    h += '<table class="t"><thead><tr><th style="width:36px"><input type="checkbox" class="cbx" data-a="callsel"'+(nSel && nSel===ls.length?' checked':'')+'></th><th>Kontakt</th><th>Telefon</th><th>Funnel</th><th>Wert</th><th>Status</th><th>Eingang</th></tr></thead><tbody>';
    ls.forEach(function(l){
      h += '<tr data-a="lead" data-id="'+l.id+'"><td data-stop><input type="checkbox" class="cbx" data-a="csel" data-id="'+l.id+'"'+(S.csel[l.id]?' checked':'')+'></td>'
        + '<td><div class="who">'+avatar(l.name||l.email)+'<div><div class="nm">'+esc(l.name||'Unbekannt')+(l.demo?' <span class="tag">Demo</span>':'')+(l.test?' <span class="tag a">Test</span>':'')+'</div><div class="sub">'+esc(l.email||'–')+'</div></div></div></td>'
        + '<td>'+esc(l.phone||'–')+'</td><td><span class="sub" style="color:var(--ink2)">'+esc(l.funnelName)+'</span></td><td style="font-weight:600">'+(l.total?FP.money(l.total):'–')+'</td>'
        + '<td data-stop><select class="stsel s-'+l.status+'" data-a="lstat" data-id="'+l.id+'">'+STATUSES.map(function(s){ return '<option value="'+s[0]+'"'+(l.status===s[0]?' selected':'')+'>'+s[1]+'</option>'; }).join('')+'</select></td>'
        + '<td class="sub">'+fmtRel(l.createdAt)+'</td></tr>';
    });
    h += '</tbody></table>';
  }
  return h + '</div></div>';
}

  var items = (l.items||[]).map(function(it){ return '<div>'+esc(it.label)+(it.detail?'<br><span style="font-size:11.5px">'+esc(it.detail)+'</span>':'')+'</div><div style="text-align:right;font-weight:550">'+FP.money(it.amount)+'</div>'; }).join('');

    + '<div class="db"><div class="row2" style="margin-bottom:6px"><div class="fld"><label>Status</label><select class="inp" id="dst">'+STATUSES.map(function(s){ return '<option value="'+s[0]+'"'+(l.status===s[0]?' selected':'')+'>'+s[1]+'</option>'; }).join('')+'</select></div><div class="fld"><label>Wert</label><div class="inp" style="display:flex;align-items:center;font-weight:650">'+(l.total?FP.money(l.total):'–')+'</div></div></div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap">'+(l.email?'<a class="btn sm" href="mailto:'+esc(l.email)+'">'+I('mail',14)+esc(l.email)+'</a>':'')+(l.phone?'<a class="btn sm" href="tel:'+esc(l.phone.replace(/\s/g,''))+'">'+I('tel',14)+esc(l.phone)+'</a>':'')+'</div>'

    + '<div class="dsec">Notizen</div><textarea class="inp" id="dnote" placeholder="Interne Notiz …" style="min-height:90px">'+esc(l.notes||'')+'</textarea>'
    + (l.durationSec?'<p class="hint">Ausfülldauer: '+l.durationSec+' Sek.</p>':'')
    + '<div style="margin-top:20px;display:flex;gap:8px"><button class="btn sm" data-copyj>'+I('copy',13)+'Als JSON kopieren</button><span style="flex:1"></span>'+(isAdmin()?'<button class="btn sm danger" data-del>'+I('trash',13)+'Löschen</button>':'')+'</div></div>';

  if(d.querySelector('[data-del]')) d.querySelector('[data-del]').onclick = function(){ confirmBox('Kontakt löschen?','Dieser Kontakt wird dauerhaft entfernt.','Löschen',function(){ db.leads = db.leads.filter(function(x){ return x.id !== id; }); save(); close(); toast('Kontakt gelöscht'); }, true); };
}
function leadsCsv(){
  var ls = filteredLeads(), keys = [];
  ls.forEach(function(l){ (l.fields||[]).forEach(function(f){ if(f.type !== 'signature' && keys.indexOf(f.label) < 0) keys.push(f.label); }); });
  var q = function(v){ v = String(v == null ? '' : v); return /[;"\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  var head = ['Eingang','Funnel','Status','Name','E-Mail','Telefon','Wert'].concat(keys);
  var rows = ls.map(function(l){ var m = {}; (l.fields||[]).forEach(function(f){ m[f.label] = f.value; }); return [fmtDT(l.createdAt), l.funnelName, l.status, l.name, l.email, l.phone, l.total||''].concat(keys.map(function(k){ return m[k]; })).map(q).join(';'); });
  return [head.map(q).join(';')].concat(rows).join('\n');
}

/* ---------- views: analytics ---------- */
function viewAnalytics(){
  var VF = visibleFunnels();
  if(!S.afid || VF.map(function(x){ return x.id; }).indexOf(S.afid) < 0) S.afid = (VF.filter(function(f){ return f.stats.views; })[0] || VF[0] || {}).id;
  var f = getF(S.afid);
  var h = '<div class="page"><div class="ph"><div><h1>Analytics</h1><p>Performance, Drop-off und Antwortverteilung pro Funnel.</p></div><div class="sp"></div><select class="inp" style="width:240px;height:36px" id="afun">'+VF.map(function(x){ return '<option value="'+x.id+'"'+(x.id===S.afid?' selected':'')+'>'+esc(x.name)+'</option>'; }).join('')+'</select></div>';
  if(!f) return h + '<div class="empty">Noch keine Funnels vorhanden.</div></div>';
  var ls = leadsOf(f.id), st = f.stats;
  var avg = ls.length ? ls.reduce(function(a,l){ return a + (l.total||0); }, 0) / ls.length : 0;
  if(f.demo) h += '<div style="margin:-8px 0 16px"><span class="demo-note">'+I('info',13)+'Dieser Funnel enthält Demo-Daten zur Veranschaulichung.</span></div>';
  h += '<div class="kpis" style="grid-template-columns:repeat(5,1fr)">'+kpi('Aufrufe', fmtNum(st.views), 'Funnel geöffnet', 'eye')+kpi('Starts', fmtNum(st.starts), (st.views?Math.round(st.starts/st.views*100):0)+' % Start-Rate', 'play')+kpi('Abschlüsse', fmtNum(st.completes), 'Formular abgesendet', 'check')+kpi('Conversion', conv(f).toFixed(1).replace('.',',')+' %', 'Aufruf → Abschluss', 'percent')+kpi('Ø Anfragewert', avg?FP.money(avg):'–', ls.length+' Leads', 'euro')+'</div>';
  // daily chart
  var days = []; for(var i=13;i>=0;i--){ var k = dayKey(Date.now()-i*864e5); days.push({k:k, v:(st.daily[k]||{}).v||0, l:(st.daily[k]||{}).l||0}); }
  var mx = Math.max.apply(null, days.map(function(d){ return d.v; }).concat([5]));
  var W = 640, H = 220, pad = 28, bw = (W - pad) / days.length;
  var svg = '<svg viewBox="0 0 '+W+' '+(H+24)+'" style="width:100%;height:auto;display:block">';
  [0,.5,1].forEach(function(g){ var y = 10 + (H-20)*(1-g); svg += '<line x1="'+pad+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="#eef0f3"/><text x="'+(pad-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="#9aa0ad">'+Math.round(mx*g)+'</text>'; });
  days.forEach(function(d, ix){
    var x = pad + ix*bw + bw*0.18, w = bw*0.64, vh = (H-20) * d.v / mx, lh = (H-20) * d.l / mx;
    svg += '<rect x="'+x+'" y="'+(H-10-vh)+'" width="'+w+'" height="'+Math.max(vh,0)+'" rx="4" fill="#d9e1e8"><title>'+d.k+': '+d.v+' Aufrufe</title></rect>';
    svg += '<rect x="'+(x+w*0.2)+'" y="'+(H-10-lh)+'" width="'+(w*0.6)+'" height="'+Math.max(lh,0)+'" rx="3" fill="#1c2e3d"><title>'+d.k+': '+d.l+' Leads</title></rect>';
    if(ix % 2 === 0) svg += '<text x="'+(x+w/2)+'" y="'+(H+12)+'" text-anchor="middle" font-size="10" fill="#9aa0ad">'+d.k.slice(8)+'.'+d.k.slice(5,7)+'.</text>';
  });
  svg += '</svg>';
  h += '<div class="charts"><div class="card"><div class="ch"><h3>Letzte 14 Tage</h3><span style="flex:1"></span><div class="legend"><span><i style="background:#d9e1e8"></i>Aufrufe</span><span><i style="background:#1c2e3d"></i>Leads</span></div></div><div class="cb">'+svg+'</div></div>';
  // dropoff
  var first = st.pages[f.pages[0].id] || st.views || 0;
  h += '<div class="card"><div class="ch"><h3>Funnel-Verlauf</h3><p>Besucher pro Seite</p></div><div class="cb bars">';
  if(!first) h += '<p style="color:var(--mut);margin:0">Noch keine Daten. Öffne die Vorschau, um Testdaten zu erzeugen.</p>';
  else f.pages.forEach(function(p, ix){ var c = st.pages[p.id] || 0, pc = first ? Math.round(c/first*100) : 0; h += '<div class="br"><span class="lb">'+(ix+1)+'. '+esc(p.name)+'</span><div class="tr"><i style="width:'+pc+'%"></i>'+(pc>12?'<span>'+pc+' %</span>':'')+'</div><span class="vv"><b>'+fmtNum(c)+'</b></span></div>'; });
  h += '</div></div></div>';
  // answer distribution
  var chs = FP.allBlocks(f).filter(function(b){ return b.type === 'choice'; });
  if(chs.length){

var CONFIG = window.FS_CONFIG || null;
var REMOTE = !!(CONFIG && CONFIG.supabaseUrl && CONFIG.supabaseAnonKey);
var sb = null;
function isAdmin(){ return !!(S.user && S.user.role === 'admin' && !S.as); }
function realAdmin(){ return !!(S.user && S.user.role === 'admin'); }
function myClientId(){ return S.as || (S.user && S.user.clientId) || null; }
function clientById(id){ return (db.clients||[]).filter(function(c){ return c.id === id; })[0] || null; }

function publicUrl(f){ var base = (CONFIG && CONFIG.publicUrl) || (location.origin + location.pathname.replace(/[^/]*$/, '')); return base.replace(/\/$/, '') + '/f/' + (f.slug || ''); }
function ensureSlug(f){ if(!f.slug) f.slug = slug(f.name).slice(0, 40) + '-' + f.id.slice(0, 5); return f.slug; }

/* ---------- login ---------- */
function renderLogin(){
  var demo = !REMOTE;
  var users = demo ? (db.users||[]) : [];
  $('#app').innerHTML = '<div class="login"><div class="lcard"><div class="lbrand"><img src="'+TT_LOGO+'" alt="TapTell"><span>'+(demo?'Demo-Modus':'Mobile Funnels')+'</span></div>'
    + '<h2>Willkommen zurück</h2><p class="lsub">Melde dich mit deinem Zugang an.</p>'
    + '<form id="lform"><div class="fld"><label>E-Mail</label><input class="inp" id="lmail" type="email" autocomplete="username" required></div><div class="fld"><label>Passwort</label><input class="inp" id="lpw" type="password" autocomplete="current-password" required></div>'
    + '<div id="lerr" class="lerr"></div><button class="btn pri" style="width:100%;justify-content:center;height:40px" type="submit">Anmelden</button></form>'
    + (demo ? '' : '<button class="btn ghost sm" data-a="forgot" style="margin:12px auto 0;display:flex">Passwort vergessen?</button>')
    + (demo ? '<div class="ldemo"><div class="flab">Demo-Zugänge (Passwort: demo)</div>' + users.map(function(u){ return '<button class="btn sm" data-a="demoLogin" data-id="'+u.id+'" style="width:100%;justify-content:flex-start;margin-bottom:6px">'+I(u.role==='admin'?'settings':'user',14)+'<span style="flex:1;text-align:left">'+esc(u.email)+'</span><span class="tag'+(u.role==='admin'?' a':'')+'">'+(u.role==='admin'?'Admin':esc((clientById(u.clientId)||{}).name||'Kunde'))+'</span></button>'; }).join('') + '<p class="hint" style="margin-top:8px">Im Demo-Modus liegt alles nur in diesem Browser. Mit Supabase verbunden werden daraus echte Logins.</p></div>' : '')
    + '</div></div>';
  setTimeout(function(){ var m = $('#lmail'); if(m) m.focus(); }, 30);
  $('#lform').onsubmit = function(e){
    e.preventDefault();
    var email = $('#lmail').value.trim().toLowerCase(), pw = $('#lpw').value, err = $('#lerr');
    if(demo){
      var u = (db.users||[]).filter(function(x){ return x.email.toLowerCase() === email && x.password === pw; })[0];
      if(!u){ err.textContent = 'E-Mail oder Passwort falsch.'; return; }
      loginLocal(u);
    } else {
      err.textContent = ''; var btn = e.target.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Anmelden …';
      sb.auth.signInWithPassword({email:email, password:pw}).then(function(r){
        if(r.error){ err.textContent = r.error.message === 'Invalid login credentials' ? 'E-Mail oder Passwort falsch.' : r.error.message; btn.disabled = false; btn.textContent = 'Anmelden'; return; }
        afterLogin(r.data.user);
      });
    }
  };
}
function loginLocal(u){
  S.user = {id:u.id, email:u.email, name:u.name, role:u.role, clientId:u.clientId || null}; S.as = null;
  try{ sessionStorage.setItem('fs.session', u.id); }catch(e){}
  S.view = 'funnels'; render();
}
function renderSetPassword(){
  $('#app').innerHTML = '<div class="login"><div class="lcard"><div class="lbrand"><img src="'+TT_LOGO+'" alt="TapTell"><span>Zugang einrichten</span></div><h2>Passwort festlegen</h2><p class="lsub">Lege ein Passwort für <b>'+esc(S.user.email)+'</b> fest.</p><form id="pform"><div class="fld"><label>Neues Passwort</label><input class="inp" id="pw1" type="password" minlength="8" autocomplete="new-password" required></div><div class="fld"><label>Wiederholen</label><input class="inp" id="pw2" type="password" minlength="8" autocomplete="new-password" required></div><div id="lerr" class="lerr"></div><button class="btn pri" style="width:100%;justify-content:center;height:40px" type="submit">Speichern & weiter</button></form></div></div>';
  $('#pform').onsubmit = function(e){
    e.preventDefault(); var a = $('#pw1').value, b = $('#pw2').value, err = $('#lerr');
    if(a.length < 8){ err.textContent = 'Mindestens 8 Zeichen.'; return; }
    if(a !== b){ err.textContent = 'Die Passwörter stimmen nicht überein.'; return; }
    sb.auth.updateUser({password:a}).then(function(r){ if(r.error){ err.textContent = r.error.message; return; } S.needPw = false; try{ history.replaceState(null,'','#funnels'); }catch(x){} toast('Passwort gespeichert'); render(); });
  };
}
function logout(){
  S.user = null; S.as = null; S.view = 'funnels';
  try{ sessionStorage.removeItem('fs.session'); }catch(e){}
  if(REMOTE && sb){ sb.auth.signOut().then(function(){ db = emptyDb(); render(); }); } else render();
}

/* ---------- client portal ---------- */
function viewPortal(){
  var fs = visibleFunnels(), ls = visibleLeads(), c = clientById(myClientId()) || {};
  var views = 0, comp = 0; fs.forEach(function(f){ views += f.stats.views || 0; comp += f.stats.completes || 0; });
  var week = ls.filter(function(l){ return l.createdAt > Date.now() - 7*864e5; }).length;
  var h = '<div class="page"><div class="ph"><div><h1>Hallo'+(S.user && S.user.name && !S.as ? ', '+esc(S.user.name.split(' ')[0]) : '')+' 👋</h1><p>Deine Funnels, Anfragen und Auswertungen für '+esc(c.name||'dein Unternehmen')+'.</p></div></div>';
  h += '<div class="kpis">' + kpi('Aktive Funnels', fs.filter(function(f){ return f.status==='live'; }).length + ' / ' + fs.length, 'freigeschaltet', 'funnel') + kpi('Aufrufe', fmtNum(views), 'gesamt', 'eye') + kpi('Anfragen', fmtNum(ls.length), '<b>+'+week+'</b> in den letzten 7 Tagen', 'inbox') + kpi('Ø Conversion', (views ? comp/views*100 : 0).toFixed(1).replace('.',',') + ' %', 'Aufruf → Anfrage', 'percent') + '</div>';
  if(!fs.length) return h + '<div class="empty">Für dich wurden noch keine Funnels freigeschaltet.</div></div>';
  h += '<div class="grid">';
  fs.forEach(function(f){
    var lc = leadsOf(f.id).length, nNew = leadsOf(f.id).filter(function(l){ return l.status==='neu'; }).length;
    h += '<div class="fcard" data-a="portalPreview" data-id="'+f.id+'"><div class="thumb">'+mini(f)+'</div><div class="meta"><div class="nm"><span>'+esc(f.name)+'</span><span class="pill '+(f.status==='live'?'live':'draft')+'" style="flex:none">'+(f.status==='live'?'Live':'Pausiert')+'</span></div>'
      + '<div class="st"><span><b>'+fmtNum(f.stats.views)+'</b>Aufrufe</span><span><b>'+lc+'</b>Anfragen</span><span><b>'+conv(f).toFixed(1).replace('.',',')+'%</b>CR</span></div>'
      + '<div style="display:flex;gap:6px;margin-top:12px"><button class="btn sm" data-a="portalLeads" data-id="'+f.id+'">'+I('inbox',13)+'Anfragen'+(nNew?' <span class="pill live nos" style="padding:0 6px">'+nNew+' neu</span>':'')+'</button><button class="btn sm" data-a="portalStats" data-id="'+f.id+'">'+I('chart',13)+'Analytics</button>'+(REMOTE && f.status==='live'?'<button class="btn sm ic" data-a="portalLink" data-id="'+f.id+'" title="Link kopieren">'+I('link',13)+'</button><button class="btn sm ic" data-a="portalQR" data-id="'+f.id+'" title="QR-Code">'+I('grid',13)+'</button>':'')+'</div></div></div>';
  });
  return h + '</div></div>';
}

function viewCustomers(){

function funnelToRow(f){ ensureSlug(f); return {id:f.id, name:f.name, slug:f.slug, status:f.status, client_id:f.clientId || null, shared:!!f.shared, theme:f.theme, settings:f.settings, pages:f.pages, created_at:new Date(f.createdAt||Date.now()).toISOString(), updated_at:new Date(f.updatedAt||Date.now()).toISOString()}; }

async function afterLogin(u){
  var pr = await sb.from('profiles').select('*').eq('id', u.id).maybeSingle();
  if(pr.error || !pr.data){ await sb.auth.signOut(); toast('Für dieses Konto ist kein Zugang eingerichtet.'); S.user = null; return render(); }
  S.user = {id:u.id, email:u.email, name:pr.data.name || '', role:pr.data.role, clientId:pr.data.client_id};
  try{ await loadRemote(); }catch(e){ toast('Daten konnten nicht geladen werden: ' + (e.message || e)); }
  if(S.view === 'editor' && !getF(S.fid)) S.view = 'funnels';
  render();
}
async function loadRemote(){
  var q = await Promise.all([sb.from('clients').select('*'), sb.from('funnels').select('*'), sb.from('leads').select('*').order('created_at', {ascending:false}).limit(10000), sb.rpc('funnel_stats'), sb.from('app_settings').select('data').eq('id', 1).maybeSingle(), realAdmin() ? sb.from('profiles').select('*') : Promise.resolve({data:[]})]);
  q.forEach(function(r){ if(r.error) throw r.error; });
  var stats = {}; (q[3].data || []).forEach(function(r){ stats[r.funnel_id] = {views:+r.views || 0, starts:+r.starts || 0, completes:+r.completes || 0, pages:r.pages || {}, daily:r.daily || {}}; });
  var set = (q[4].data && q[4].data.data) || {};
  db = emptyDb();
  db.clients = (q[0].data || []).map(rowToClient);
  db.funnels = (q[1].data || []).map(function(r){ return rowToFunnel(r, stats[r.id]); }).sort(function(a, b){ return b.updatedAt - a.updatedAt; });
  db.leads = (q[2].data || []).map(rowToLead);
  db.users = (q[5].data || []).map(function(p){ return {id:p.id, email:p.email, name:p.name, role:p.role, clientId:p.client_id}; });
  if(set.brand) db.brand = set.brand; if(set.defaults) db.defaults = set.defaults; if(set.fonts) db.fonts = set.fonts;
  SNAP = {funnels:{}, leads:{}, clients:{}, settings:JSON.stringify(settingsPayload())};
  db.funnels.forEach(function(f){ SNAP.funnels[f.id] = JSON.stringify(funnelToRow(f)); });
  db.leads.forEach(function(l){ SNAP.leads[l.id] = JSON.stringify(leadToRow(l)); });
  db.clients.forEach(function(c){ SNAP.clients[c.id] = JSON.stringify(clientToRow(c)); });
  ensureFonts();
}
async function syncTable(table, list, toRow, onlyCols){
  var snap = SNAP[table], seen = {}, ups = [], pend = {};
  list.forEach(function(o){ var r = toRow(o), h = JSON.stringify(r); seen[r.id] = 1; if(snap[r.id] !== h){ ups.push(r); pend[r.id] = h; } });
  var dels = onlyCols ? [] : Object.keys(snap).filter(function(id){ return !seen[id]; });
  if(ups.length){
    if(onlyCols){ for(var i=0;i<ups.length;i++){ var patch = {}; onlyCols.forEach(function(k){ patch[k] = ups[i][k]; }); var r1 = await sb.from(table).update(patch).eq('id', ups[i].id); if(r1.error) throw r1.error; } }
    else { var r2 = await sb.from(table).upsert(ups); if(r2.error) throw r2.error; }
    Object.keys(pend).forEach(function(id){ snap[id] = pend[id]; });
  }
  if(dels.length){ var r3 = await sb.from(table).delete().in('id', dels); if(r3.error) throw r3.error; dels.forEach(function(id){ delete snap[id]; }); }
}
async function syncRemote(){
  if(!sb || !S.user) return;
  if(syncing){ syncAgain = true; return; }
  syncing = true; setSaved(null);
  try{
    if(realAdmin()){
      await syncTable('clients', db.clients || [], clientToRow);
      await syncTable('funnels', db.funnels, funnelToRow);
      var sp = JSON.stringify(settingsPayload()); if(sp !== SNAP.settings){ var r = await sb.from('app_settings').upsert({id:1, data:settingsPayload()}); if(r.error) throw r.error; SNAP.settings = sp; }
      await syncTable('leads', db.leads, leadToRow);
    } else {
      await syncTable('leads', visibleLeads(), leadToRow, ['status','notes']);
    }
    setSaved(true);
  }catch(e){ setSaved(false); toast('Speichern fehlgeschlagen: ' + (e.message || e)); }
  syncing = false;
  if(syncAgain){ syncAgain = false; syncRemote(); }
}

function setScoped(scope, k, v){
  var f = F();
  if(scope === 'p'){ var b = selBlock(); if(b) b.props[k] = v; }
  else if(scope === 'pp'){ curPage()[k] = v; }
  else if(scope === 't'){ f.theme[k] = v; }
  else if(scope === 's'){ f.settings[k] = v; }
  else if(scope === 'brand'){ db.brand[k] = v; save(); return; }
  touch();
}

document.addEventListener('click', function(e){

  var blk = e.target.closest('#scr .fp-b[data-bid]');

});

function readVal(el){ if(el.hasAttribute('data-bool')){ var c = el.checked; return el.hasAttribute('data-inv') ? (c ? undefined : false) : c; } if(el.hasAttribute('data-num')) return el.value === '' ? '' : +el.value; return el.value; }

  if(el.id === 'qrurl'){ var pf = F() || null; clearTimeout(window.__qrT); window.__qrT = setTimeout(function(){ drawQR(el.value.trim()); var pc = $('#pubcode'); if(pc) pc.value = el.value.trim(); }, 300); if(pf){ pf.settings.hostedUrl = el.value.trim(); save(); } return; }
  if(el.id === 'libq'){ S.libq = el.value; var p3 = el.selectionStart; renderLeft(); var n3 = $('#libq'); n3.focus(); n3.setSelectionRange(p3,p3); return; }
  if(el.id === 'fname' || el.hasAttribute('data-fn')){ var f = F(); snap(); f.name = el.value || 'Unbenannt'; touch(); if(el.id === 'fname') el.size = Math.max(8, el.value.length); else { var fn = $('#fname'); if(fn) fn.value = f.name; } return; }
  if(el.hasAttribute('data-brand')){ var k0 = el.getAttribute('data-brand'), v0 = readVal(el); db.brand[k0] = v0; syncColor(el, 'brand', k0, v0); rangeLabel(el); save(); return; }

    if(el.type === 'checkbox' || el.tagName === 'SELECT') snap(true); else snap();
    if(v === undefined){ var tgt = scope==='p'?selBlock().props:scope==='pp'?curPage():scope==='t'?F().theme:F().settings; delete tgt[k]; touch(); }
    else setScoped(scope, k, v);

    if(scope === 'pp' && (k === 'next')) renderLeft();

  if(el.hasAttribute('data-o')){ var b = selBlock(), i = +el.getAttribute('data-oi'), ok = el.getAttribute('data-o'); snap(el.tagName === 'SELECT'); b.props.options[i][ok] = readVal(el); touch(); renderCanvas(true); if(ok === 'goto'){ renderLeft(); renderRight(); } return; }
  if(el.hasAttribute('data-arr')){ var b2 = selBlock(); snap(); b2.props[el.getAttribute('data-arr')][+el.getAttribute('data-ai')] = el.value; touch(); renderCanvas(true); return; }
  if(el.hasAttribute('data-faq')){ var b3 = selBlock(); snap(); b3.props.items[+el.getAttribute('data-faq')][el.getAttribute('data-fk')] = el.value; touch(); renderCanvas(true); return; }
  if(el.hasAttribute('data-sr')){ var pg = curPage(), r = pg.scoreRoutes[+el.getAttribute('data-sr')], sk = el.getAttribute('data-sk'); snap(el.tagName === 'SELECT'); r[sk] = sk === 'goto' ? el.value : +el.value; touch(); renderLeft(); return; }
});
function syncColor(el, scope, k, v){ var w = el.closest('.colr'); if(!w) return; $$('input', w).forEach(function(x){ if(x !== el){ if(x.type === 'color') x.value = toHex(v); else x.value = v; } }); }
function rangeLabel(el){ if(el.type === 'range'){ var s = el.parentNode.querySelector('span'); if(s) s.textContent = el.value + (el.hasAttribute('data-unit') ? el.getAttribute('data-unit') : 'px'); } }

document.addEventListener('change', function(e){

      promptBox('Schrift benennen','Name der Schrift', name, function(n){ db.fonts.uploaded = (db.fonts.uploaded||[]).filter(function(x){ return x.name !== n; }).concat([{name:n, data:rd.result}]); injectUploaded(); save(); toast('„'+n+'“ hochgeladen'); renderRight(); }); };

document.addEventListener('keydown', function(e){
  if(S.view !== 'editor' || $('.mbg') || $('.pvw')) return;
  var tag = (e.target.tagName||'').toLowerCase(), typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
  var mod = e.metaKey || e.ctrlKey;
  if(mod && e.key.toLowerCase() === 'z' && !typing){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); return; }
  if(mod && e.key.toLowerCase() === 'y' && !typing){ e.preventDefault(); redo(); return; }
  if(typing || !S.sel) return;
  if(e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); delBlock(); }
  else if(mod && e.key.toLowerCase() === 'd'){ e.preventDefault(); dupBlock(); }
  else if(e.key === 'ArrowUp' && e.altKey === false && mod === false){ e.preventDefault(); moveBlock(-1); }
  else if(e.key === 'ArrowDown' && mod === false){ e.preventDefault(); moveBlock(1); }
  else if(e.key === 'Escape'){ S.sel = null; S.rtab = 'page'; renderCanvas(true); renderRight(); }
});

/* ---- drag & drop ---- */
var drag = null;
function clearDrop(){ $$('.dropline').forEach(function(d){ d.remove(); }); $$('.dragover').forEach(function(d){ d.classList.remove('dragover'); }); }
document.addEventListener('dragstart', function(e){
  var li = e.target.closest && e.target.closest('[data-lib]');
  if(li){ drag = {kind:'new', lib:li.getAttribute('data-lib')}; e.dataTransfer.effectAllowed = 'copy'; try{ e.dataTransfer.setData('text/plain', drag.lib); }catch(x){} return; }
  var blk = e.target.closest && e.target.closest('#scr .fp-b[data-bid]');
  if(blk){ drag = {kind:'move', id:blk.getAttribute('data-bid')}; e.dataTransfer.effectAllowed = 'move'; try{ e.dataTransfer.setData('text/plain', drag.id); }catch(x){} setTimeout(function(){ blk.classList.add('dragging'); }, 0); var tb = $('#btool'); if(tb) tb.remove(); return; }
  var pg = e.target.closest && e.target.closest('[data-pidx]');
  if(pg){ drag = {kind:'page', idx:+pg.getAttribute('data-pidx')}; e.dataTransfer.effectAllowed = 'move'; try{ e.dataTransfer.setData('text/plain', 'page'); }catch(x){} }
});
function dropIndex(scr, y){
  var blocks = $$('.fp-page > .fp-b[data-bid]', scr), idx = blocks.length;
  for(var i=0;i<blocks.length;i++){ var r = blocks[i].getBoundingClientRect(); if(y < r.top + r.height/2){ idx = i; break; } }
  return {idx:idx, blocks:blocks};
}
document.addEventListener('dragover', function(e){
  if(!drag) return;
  var scr = e.target.closest && e.target.closest('#scr');
  var pt = e.target.closest && e.target.closest('[data-pidx]');
  if(pt){
    e.preventDefault(); clearDrop(); pt.classList.add('dragover');
    e.dataTransfer.dropEffect = drag.kind === 'new' ? 'copy' : 'move'; return;
  }
  if(scr && drag.kind !== 'page'){
    e.preventDefault(); e.dataTransfer.dropEffect = drag.kind === 'new' ? 'copy' : 'move';
    var d = dropIndex(scr, e.clientY), line = $('.dropline', scr);
    if(!line){ clearDrop(); line = document.createElement('div'); line.className = 'dropline'; scr.appendChild(line); }
    var sr = scr.getBoundingClientRect(), y;
    if(!d.blocks.length){ var pgEl = $('.fp-page', scr); y = pgEl.getBoundingClientRect().top + 10; }
    else if(d.idx < d.blocks.length) y = d.blocks[d.idx].getBoundingClientRect().top - 8;
    else { var lr = d.blocks[d.blocks.length-1].getBoundingClientRect(); y = lr.bottom + 4; }
    line.style.top = (y - sr.top + scr.scrollTop) + 'px';
    // autoscroll
    if(e.clientY < sr.top + 60) scr.scrollTop -= 12; else if(e.clientY > sr.bottom - 60) scr.scrollTop += 12;
    return;
  }
  clearDrop();
});
document.addEventListener('drop', function(e){
  if(!drag) return;
  var d0 = drag; drag = null;
  var scr = e.target.closest && e.target.closest('#scr'), pt = e.target.closest && e.target.closest('[data-pidx]');
  var f = F(); if(!f){ clearDrop(); return; }
  e.preventDefault();
  if(pt){
    var ti = +pt.getAttribute('data-pidx');
    clearDrop();
    if(d0.kind === 'page'){ if(ti === d0.idx) return; snap(true); var curId = f.pages[S.pi].id; var p = f.pages.splice(d0.idx,1)[0]; f.pages.splice(ti,0,p); S.pi = f.pages.map(function(x){ return x.id; }).indexOf(curId); touch(); renderLeft(); renderCanvas(); renderRight(); return; }
    if(d0.kind === 'new'){ var blocks = makeFromLib(d0.lib); insertBlocks(blocks, ti, null); toast('Zu „'+f.pages[ti].name+'“ hinzugefügt'); return; }
    if(d0.kind === 'move'){ var fb = findBlock(f, d0.id); if(!fb || fb.pi === ti) { renderCanvas(true); return; } snap(true); fb.page.blocks.splice(fb.bi,1); f.pages[ti].blocks.push(fb.b); S.pi = ti; S.sel = fb.b.id; touch(); renderLeft(); renderCanvas(); renderRight(); toast('Nach „'+f.pages[ti].name+'“ verschoben'); return; }
  }
  if(scr && d0.kind !== 'page'){
    var di = dropIndex(scr, e.clientY).idx; clearDrop();
    if(d0.kind === 'new'){ insertBlocks(makeFromLib(d0.lib), S.pi, di); return; }
    var pg = curPage(), from = pg.blocks.map(function(b){ return b.id; }).indexOf(d0.id);
    if(from < 0) return;
    if(di > from) di--;
    if(di === from){ renderCanvas(true); return; }
    snap(true); var bb = pg.blocks.splice(from,1)[0]; pg.blocks.splice(di,0,bb); S.sel = bb.id; touch(); renderCanvas(true); renderRight();
    return;
  }
  clearDrop();
});
document.addEventListener('dragend', function(){ drag = null; clearDrop(); $$('.fp-b.dragging').forEach(function(b){ b.classList.remove('dragging'); }); if(S.view === 'editor' && S.sel){ var el = $('#scr .fp-b.sel'); if(el) placeTool(el); } });

window.addEventListener('hashchange', function(){ var prev = S.view + S.fid; fromHash(); if(S.view + S.fid !== prev){ if(S.view === 'editor'){ S.pi = 0; S.sel = null; S.hist = []; S.fut = []; } render(); } });
window.addEventListener('resize', function(){ if(S.view === 'editor' && S.sel){ var el = $('#scr .fp-b.sel'); if(el) placeTool(el); } });

/* ---- boot ---- */
if(REMOTE){ db = emptyDb(); fromHash(); bootRemote(); }
else {
